<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INOL Workout Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .input-group { @apply mb-4; }
        .label { @apply block text-sm font-medium text-gray-700 mb-1; }
        .input { @apply w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none transition; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">INOL Calculator</h1>
        <p class="text-sm text-gray-500 mb-6">Balance your intensity and volume to optimize recovery.</p>

        <div class="space-y-4">
            <div class="input-group">
                <label class="label">1-Rep Max (1RM)</label>
                <input type="number" id="oneRm" class="input" placeholder="e.g. 100">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="input-group">
                    <label class="label">Weight Lifted</label>
                    <input type="number" id="weight" class="input" placeholder="e.g. 80">
                </div>
                <div class="input-group">
                    <label class="label">Reps Per Set</label>
                    <input type="number" id="reps" class="input" placeholder="e.g. 5">
                </div>
            </div>

            <div class="input-group">
                <label class="label">Number of Sets</label>
                <input type="number" id="sets" class="input" placeholder="e.g. 3">
            </div>

            <button onclick="calculateInol()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200">
                Calculate Score
            </button>
        </div>

        <div id="result" class="mt-8 hidden">
            <div class="border-t pt-6 text-center">
                <div class="text-gray-600 text-sm uppercase tracking-wide">Your INOL Score</div>
                <div id="inolValue" class="text-5xl font-extrabold my-2">0.00</div>
                <div id="intensityVal" class="text-sm text-gray-500 mb-4">Intensity: 0%</div>
                <div id="feedback" class="p-3 rounded-lg text-sm font-semibold"></div>
            </div>
        </div>
    </div>

    <script>
        function calculateInol() {
            const oneRm = parseFloat(document.getElementById('oneRm').value);
            const weight = parseFloat(document.getElementById('weight').value);
            const reps = parseFloat(document.getElementById('reps').value);
            const sets = parseFloat(document.getElementById('sets').value);
            
            if (!oneRm || !weight || !reps || !sets) {
                alert("Please fill in all fields.");
                return;
            }

            const intensity = (weight / oneRm) * 100;
            const totalReps = reps * sets;
            const inol = totalReps / (100 - intensity);

            // Update UI
            document.getElementById('result').classList.remove('hidden');
            document.getElementById('inolValue').innerText = inol.toFixed(2);
            document.getElementById('intensityVal').innerText = `Intensity: ${intensity.toFixed(1)}% | Total Reps: ${totalReps}`;

            const feedback = document.getElementById('feedback');
            
            if (inol < 0.4) {
                feedback.innerText = "Too Easy: Recovery or Deload Zone.";
                feedback.className = "p-3 rounded-lg text-sm font-semibold bg-gray-100 text-gray-700";
            } else if (inol <= 1.0) {
                feedback.innerText = "The Sweet Spot: Optimal for growth.";
                feedback.className = "p-3 rounded-lg text-sm font-semibold bg-green-100 text-green-700";
            } else {
                feedback.innerText = "Danger Zone: Highly taxing. Use sparingly.";
                feedback.className = "p-3 rounded-lg text-sm font-semibold bg-red-100 text-red-700";
            }
        }
    </script>
</body>
</html>
