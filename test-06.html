<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robinson Crusoe Round Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased selection:bg-amber-500 selection:text-slate-900">

  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 shadow-md">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <a href="#" id="home-btn" class="flex items-center gap-2 text-amber-400 hover:text-amber-300 font-bold tracking-wide transition">
        <i class="fa-solid fa-island-tropical text-xl"></i>
        <span>RC Tracker</span>
      </a>
      <div class="flex items-center gap-2">
        <button id="undo-btn" class="p-2 rounded bg-slate-700 hover:bg-slate-600 disabled:opacity-40 disabled:hover:bg-slate-700 transition" title="Undo">
          <i class="fa-solid fa-arrow-rotate-left"></i>
        </button>
        <button id="redo-btn" class="p-2 rounded bg-slate-700 hover:bg-slate-600 disabled:opacity-40 disabled:hover:bg-slate-700 transition" title="Redo">
          <i class="fa-solid fa-arrow-rotate-right"></i>
        </button>
        <button id="reset-btn" class="ml-2 px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-sm font-semibold rounded shadow transition flex items-center gap-1">
          <i class="fa-solid fa-trash-can"></i> Reset
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 pb-24">
    
    <section id="setup-screen" class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-xl mt-4">
      <h2 class="text-xl font-bold text-amber-400 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-hourglass-start"></i> New Adventure Setup
      </h2>
      <div class="space-y-4">
        <div>
          <label for="max-days-input" class="block text-sm font-medium text-slate-300 mb-1">Total Scenario Days (Limit):</label>
          <input type="number" id="max-days-input" value="12" min="1" max="30" class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-center text-xl text-amber-400 font-bold focus:outline-none focus:border-amber-500">
        </div>
        <button id="start-game-btn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-3 rounded-lg shadow-lg transition transform active:scale-[0.98]">
          Begin Survival
        </button>
      </div>
    </section>

    <section id="tracker-screen" class="hidden space-y-4 mt-2">
      
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow flex items-center justify-between sticky top-2 z-10 backdrop-blur-md bg-opacity-95">
        <div>
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 block">Current Timeline</span>
          <span class="text-2xl font-black text-amber-400">Day <span id="current-day-display">1</span><span class="text-slate-500 text-lg font-normal">/<span id="max-days-display">12</span></span></span>
        </div>
        <div class="text-right">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 block">Active Steps</span>
          <span id="phase-progress-display" class="text-sm font-bold text-slate-300">Phase 1/6</span>
        </div>
      </div>

      <div id="phase-container" class="space-y-4">
        </div>

      <div class="flex justify-between items-center gap-4 pt-2">
        <button id="prev-phase-btn" class="flex-1 bg-slate-700 hover:bg-slate-600 disabled:opacity-40 disabled:hover:bg-slate-700 py-3 rounded-lg font-semibold transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-chevron-left"></i> Back
        </button>
        <button id="next-phase-btn" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-900 py-3 rounded-lg font-bold transition flex items-center justify-center gap-2 shadow-lg">
          Next Step <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

    </section>

    <section id="game-over-screen" class="hidden bg-slate-800 rounded-xl p-8 border border-slate-700 text-center shadow-xl mt-4 space-y-6">
      <div class="text-6xl text-rose-500 animate-bounce">
        <i class="fa-solid fa-skull-crossbones"></i>
      </div>
      <div>
        <h2 class="text-2xl font-extrabold text-slate-100">Time Has Expired!</h2>
        <p class="text-slate-400 mt-2 text-sm">You have reached the maximum allowed days for this scenario.</p>
      </div>
      <button id="restart-game-btn" class="px-6 py-3 bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold rounded-lg transition shadow-md">
        Start New Game
      </button>
    </section>

  </main>

  <script>
    // --- Data Definition matching the provided sequence reference cheat sheet ---
    const PHASES = [
      {
        name: "1. Event Phase",
        color: "border-l-4 border-red-500",
        bg: "bg-red-950/20",
        icon: "fa-card-diamond",
        notes: "Skip Event card execution entirely on Round 1.",
        rules: [
          { label: "Draw Card", detail: "Draw 1 card from the Event Stack." },
          { label: "IF Event Card", detail: "Resolve book effect OR place '?' token on matching action. (Book effect: see scenario details)." },
          { label: "Resolve Effect", detail: "Execute the text specified under the event block." },
          { label: "IF Adventure Card", detail: "Discard and draw next card immediately (re-start Event phase)." },
          { label: "Threat Field", detail: "Place card in the right threat field (shifting older cards left). If a card shifts out: resolve its threat effect, then discard it." }
        ]
      },
      {
        name: "2. Morale Phase",
        color: "border-l-4 border-amber-500",
        bg: "bg-amber-950/20",
        icon: "fa-face-smile",
        notes: "Start Player Only updates tokens first.",
        rules: [
          { label: "Tokens", detail: "Get or discard Determination tokens based on current Morale track position." },
          { label: "IF Solo Play", detail: "Gain +1 Morale first before checking your rewards." },
          { label: "Highest Level", detail: "If morale is already at maximum level: you may choose to heal 1 wound instead." },
          { label: "Token Shortage", detail: "If you don't have enough Determination tokens to discard: suffer 1 wound per missing token." }
        ]
      },
      {
        name: "3. Production Phase",
        color: "border-l-4 border-orange-500",
        bg: "bg-orange-950/20",
        icon: "fa-dolly",
        notes: "Resources are moved directly to available pools.",
        rules: [
          { label: "Camp Tiles", detail: "Collect exactly 1 resource cube per source icon depicted on the current camp tile." },
          { label: "IF Shortcut Placed", detail: "Collect 1 extra resource from the specific tile containing the shortcut token." }
        ]
      },
      {
        name: "4. Plan Actions",
        color: "border-l-4 border-pink-500",
        bg: "bg-pink-950/20",
        icon: "fa-map",
        notes: "Assign pawns to tasks. Multiple pawns per action allowed. Also assign required resources.",
        rules: [
          { label: "Threat Action", detail: "Pawn(s) as indicated on card text. Max 1x per threat card." },
          { label: "Hunting", detail: "Requires exactly 2 pawns per hunt. Only 1 hunt action allowed per beast card available in the hunt stack." },
          { label: "Building", detail: "Assign 1 or 2 pawns. Risk if only 1 pawn or '?' token is present." },
          { label: "Gathering / Exploring", detail: "Gather: Assign to specific resource tile (not on camp tile). Explore: Assign to unrevealed edge. Note: +1 pawn if distance to camp = 2. Each source pays only once per round." },
          { label: "Arrange Camp / Rest", detail: "Allocate any number of remaining available pawns here." }
        ]
      },
      {
        name: "5. Resolve Actions",
        color: "border-l-4 border-purple-500",
        bg: "bg-purple-950/20",
        icon: "fa-dice",
        notes: "Roll dice if working with less than maximum guaranteed pawns. Draw card if '?' token or '?' rolled.",
        rules: [
          { label: "Threat Resolution", detail: "Pay required resources, follow card instructions. Gained resources go to future box." },
          { label: "Hunting Results", detail: "Draw beast card. Get wounds if weapon strength < beast strength. Reduce weapon + palisade strength if required. Gain resources, resolve effects (gained resources to future, affects acting player)." },
          { label: "Building Actions", detail: "Shelter/roof/palisade/weapon: Pay costs, place/move cube. Roof/palisade upgrades need an existing shelter. Invention/Item: +2 Det. tokens if player invention. Items placed in future res." },
          { label: "Gathering Results", detail: "Take 1 resource per source used. Gained resources go to future box." },
          { label: "Exploration Results", detail: "Draw + place tile, mark new terrain type on inventions. IF beast: Add 1 beast card to hunt stack. IF mystery icon: Resolve via mystery card. IF discovery symbol: Draw discovery tokens (place in future res)." },
          { label: "Cleanup Steps", detail: "Discard tokens on action fields when that action resolves. Arrange Camp: Adjust morale if possible, player gets +2 determination. Rest: Player heals 1 wound per pawn. Return pawns to players. Move items/resources from FUTURE to AVAILABLE, resolve new scenario items." }
        ]
      },
      {
        name: "6. Weather & Night",
        color: "border-l-4 border-blue-500",
        bg: "bg-blue-950/20",
        icon: "fa-cloud-moon",
        notes: "Heal anytime during night phase rules.",
        rules: [
          { label: "Weather Dice", detail: "Roll weather dice as indicated on scenario card; add clouds from tokens. Pay 1 wood per snow cloud. Pay 1 wood + 1 food per (total # clouds - roof level). Pay once, not per player. Resolve animal die effects (roll max 1x per round). IF storm: Decrease palisade level by 1. IF in camp: Get wounds for unpaid discards." },
          { label: "Night Phase", detail: "Discard 1 food per player. Suffer 2 wounds per unpaid food item." },
          { label: "Camp Relocation", detail: "If desired, relocate camp to adjacent tile. IF built shelter, decrease roof + palisade levels by half (round losses down). IF tile shelter, lose roof + palisade completely. Resource tokens move with camp (≤1 token of each type/tile). IF shortcut placed: remove, must re-build." },
          { label: "End of Round", detail: "IF no shelter (built or tile), get 1 wound per player. Discard all yellow food/food tokens, remove black markers from player cards. Move round marker to next round, pass 1st player token to left." }
        ]
      }
    ];

    // --- State Management ---
    let state = {
      currentDay: 1,
      maxDays: 12,
      currentPhaseIndex: 0,
      isPlaying: false
    };

    let undoStack = [];
    let redoStack = [];

    // --- DOM Elements ---
    const setupScreen = document.getElementById('setup-screen');
    const trackerScreen = document.getElementById('tracker-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const maxDaysInput = document.getElementById('max-days-input');
    const startGameBtn = document.getElementById('start-game-btn');
    const restartGameBtn = document.getElementById('restart-game-btn');
    
    const currentDayDisplay = document.getElementById('current-day-display');
    const maxDaysDisplay = document.getElementById('max-days-display');
    const phaseProgressDisplay = document.getElementById('phase-progress-display');
    const phaseContainer = document.getElementById('phase-container');
    
    const prevPhaseBtn = document.getElementById('prev-phase-btn');
    const nextPhaseBtn = document.getElementById('next-phase-btn');
    const undoBtn = document.getElementById('undo-btn');
    const redoBtn = document.getElementById('redo-btn');
    const resetBtn = document.getElementById('reset-btn');
    const homeBtn = document.getElementById('home-btn');

    // --- Core Functions ---
    function init() {
      const savedState = localStorage.getItem('rc_tracker_state');
      if (savedState) {
        try {
          state = JSON.parse(savedState);
          // Sync input value just in case they return to setup
          maxDaysInput.value = state.maxDays;
        } catch(e) {
          resetToDefault();
        }
      }
      
      // Clear stacks on fresh launch/reload to keep lifecycle clean
      undoStack = [];
      redoStack = [];
      
      render();
    }

    function saveToLocalStorage() {
      localStorage.setItem('rc_tracker_state', JSON.stringify(state));
    }

    function pushToHistory() {
      undoStack.push(JSON.stringify(state));
      redoStack = []; // Clear redo on new actions
      updateHistoryButtons();
    }

    function updateHistoryButtons() {
      undoBtn.disabled = undoStack.length === 0;
      redoBtn.disabled = redoStack.length === 0;
    }

    function resetToDefault() {
      state = {
        currentDay: 1,
        maxDays: parseInt(maxDaysInput.value, 10) || 12,
        currentPhaseIndex: 0,
        isPlaying: false
      };
      undoStack = [];
      redoStack = [];
      saveToLocalStorage();
    }

    // --- UI Rendering Engine ---
    function render() {
      updateHistoryButtons();

      if (!state.isPlaying) {
        setupScreen.classList.remove('hidden');
        trackerScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        return;
      }

      if (state.currentDay > state.maxDays) {
        setupScreen.classList.add('hidden');
        trackerScreen.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
        return;
      }

      setupScreen.classList.add('hidden');
      trackerScreen.classList.remove('hidden');
      gameOverScreen.classList.add('hidden');

      // Update Displays
      currentDayDisplay.textContent = state.currentDay;
      maxDaysDisplay.textContent = state.maxDays;
      phaseProgressDisplay.textContent = `Phase ${state.currentPhaseIndex + 1}/${PHASES.length}`;

      // Build Active Phase Module Card
      const phase = PHASES[state.currentPhaseIndex];
      
      let rulesHTML = phase.rules.map(rule => `
        <div class="py-2.5 border-b border-slate-700/60 last:border-none flex flex-col sm:flex-row sm:items-baseline gap-1 sm:gap-4">
          <span class="font-bold text-slate-200 text-sm sm:w-1/4 shrink-0 flex items-center gap-1.5">
            <i class="fa-solid fa-square-caret-right text-amber-500/80 text-xs"></i> ${rule.label}
          </span>
          <span class="text-slate-300 text-sm leading-relaxed sm:w-3/4">${rule.detail}</span>
        </div>
      `).join('');

      phaseContainer.innerHTML = `
        <div class="bg-slate-800 rounded-xl shadow-xl overflow-hidden border border-slate-700 transition duration-300 ${phase.color}">
          <div class="p-4 ${phase.bg} border-b border-slate-700/50 flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-slate-900/60 flex items-center justify-center text-amber-400">
              <i class="fa-solid ${phase.icon} text-lg"></i>
            </div>
            <div>
              <h2 class="text-lg font-black tracking-wide text-slate-100">${phase.name}</h2>
              <p class="text-xs text-amber-400/90 font-medium italic mt-0.5">${phase.notes}</p>
            </div>
          </div>
          <div class="p-4 divide-y divide-slate-700/40 bg-slate-800/40">
            ${rulesHTML}
          </div>
        </div>
      `;

      // Navigation button configurations
      prevPhaseBtn.disabled = (state.currentDay === 1 && state.currentPhaseIndex === 0);
      
      if (state.currentPhaseIndex === PHASES.length - 1) {
        nextPhaseBtn.innerHTML = `Next Day <i class="fa-solid fa-sun ml-1"></i>`;
        nextPhaseBtn.classList.replace('bg-amber-500', 'bg-emerald-600');
        nextPhaseBtn.classList.replace('hover:bg-amber-400', 'hover:bg-emerald-500');
        nextPhaseBtn.classList.replace('text-slate-900', 'text-white');
      } else {
        nextPhaseBtn.innerHTML = `Next Step <i class="fa-solid fa-chevron-right ml-1"></i>`;
        nextPhaseBtn.classList.replace('bg-emerald-600', 'bg-amber-500');
        nextPhaseBtn.classList.replace('hover:bg-emerald-500', 'hover:bg-amber-400');
        nextPhaseBtn.classList.replace('text-white', 'text-slate-900');
      }
    }

    // --- Event Handlers ---
    startGameBtn.addEventListener('click', () => {
      pushToHistory();
      state.maxDays = parseInt(maxDaysInput.value, 10) || 12;
      state.currentDay = 1;
      state.currentPhaseIndex = 0;
      state.isPlaying = true;
      saveToLocalStorage();
      render();
    });

    nextPhaseBtn.addEventListener('click', () => {
      pushToHistory();
      if (state.currentPhaseIndex < PHASES.length - 1) {
        state.currentPhaseIndex++;
      } else {
        state.currentDay++;
        state.currentPhaseIndex = 0;
      }
      saveToLocalStorage();
      render();
    });

    prevPhaseBtn.addEventListener('click', () => {
      pushToHistory();
      if (state.currentPhaseIndex > 0) {
        state.currentPhaseIndex--;
      } else if (state.currentDay > 1) {
        state.currentDay--;
        state.currentPhaseIndex = PHASES.length - 1;
      }
      saveToLocalStorage();
      render();
    });

    undoBtn.addEventListener('click', () => {
      if (undoStack.length > 0) {
        redoStack.push(JSON.stringify(state));
        state = JSON.parse(undoStack.pop());
        saveToLocalStorage();
        render();
      }
    });

    redoBtn.addEventListener('click', () => {
      if (redoStack.length > 0) {
        undoStack.push(JSON.stringify(state));
        state = JSON.parse(redoStack.pop());
        saveToLocalStorage();
        render();
      }
    });

    resetBtn.addEventListener('click', () => {
      if(confirm("Are you sure you want to reset this session? All progress will be lost.")) {
        resetToDefault();
        render();
      }
    });

    restartGameBtn.addEventListener('click', () => {
      resetToDefault();
      render();
    });

    homeBtn.addEventListener('click', (e) => {
      e.preventDefault();
      pushToHistory();
      state.isPlaying = false;
      saveToLocalStorage();
      render();
    });

    // Run app initialization on load
    init();
  </script>
</body>
</html>
