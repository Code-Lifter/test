<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anki Web Flashcards</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Card Flip 3D Perspective */
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-6">

  <!-- Header -->
  <header class="w-full max-w-2xl text-center my-6">
    <h1 class="text-3xl font-bold text-indigo-400">Anki-Style Web Flashcards</h1>
    <p class="text-slate-400 text-sm mt-1">Upload your JSON flashcard file to start studying</p>
  </header>

  <main class="w-full max-w-2xl flex flex-col items-center gap-6">

    <!-- Upload & Deck Controls -->
    <section class="w-full bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-lg">
      <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium transition text-sm">
        <span>📁 Upload JSON Deck</span>
        <input type="file" id="jsonInput" accept=".json" class="hidden" />
      </label>
      
      <div id="deckInfo" class="text-xs text-slate-400">
        No deck loaded.
      </div>

      <button id="resetBtn" class="text-xs text-rose-400 hover:underline hidden">
        Clear Saved Progress
      </button>
    </section>

    <!-- Flashcard Display -->
    <section id="cardContainer" class="w-full h-80 perspective-1000 hidden">
      <div id="cardInner" class="w-full h-full relative transform-style-3d transition-transform duration-500 cursor-pointer rounded-2xl border border-slate-700 bg-slate-800 shadow-2xl flex items-center justify-center p-6 text-center">
        
        <!-- Front Side -->
        <div id="cardFront" class="absolute inset-0 backface-hidden p-6 flex flex-col items-center justify-center text-xl font-medium overflow-auto">
          <!-- Rendered content -->
        </div>

        <!-- Back Side -->
        <div id="cardBack" class="absolute inset-0 backface-hidden rotate-y-180 p-6 flex flex-col items-center justify-center text-xl font-medium overflow-auto border-t-4 border-indigo-500 rounded-2xl">
          <!-- Rendered content -->
        </div>

      </div>
    </section>

    <!-- Flip Hint -->
    <div id="flipHint" class="text-xs text-slate-500 hidden">
      Click card or press Spacebar to flip
    </div>

    <!-- Anki Rating Buttons -->
    <section id="ratingBar" class="w-full grid grid-cols-4 gap-3 hidden">
      <button onclick="rateCard(1)" class="bg-red-900/40 hover:bg-red-800/60 border border-red-700/50 text-red-300 py-3 rounded-xl font-semibold transition text-sm flex flex-col items-center">
        <span>Again</span>
        <span class="text-[10px] font-normal opacity-75">1 day</span>
      </button>
      <button onclick="rateCard(2)" class="bg-amber-900/40 hover:bg-amber-800/60 border border-amber-700/50 text-amber-300 py-3 rounded-xl font-semibold transition text-sm flex flex-col items-center">
        <span>Hard</span>
        <span class="text-[10px] font-normal opacity-75">Harder</span>
      </button>
      <button onclick="rateCard(3)" class="bg-emerald-900/40 hover:bg-emerald-800/60 border border-emerald-700/50 text-emerald-300 py-3 rounded-xl font-semibold transition text-sm flex flex-col items-center">
        <span>Good</span>
        <span class="text-[10px] font-normal opacity-75">Normal</span>
      </button>
      <button onclick="rateCard(4)" class="bg-blue-900/40 hover:bg-blue-800/60 border border-blue-700/50 text-blue-300 py-3 rounded-xl font-semibold transition text-sm flex flex-col items-center">
        <span>Easy</span>
        <span class="text-[10px] font-normal opacity-75">Longer</span>
      </button>
    </section>

    <!-- Queue Finished Message -->
    <div id="emptyState" class="text-slate-400 text-center py-12 hidden">
      <p class="text-2xl font-semibold text-emerald-400 mb-2">🎉 Deck Finished!</p>
      <p class="text-sm">You have reviewed all due cards in this deck.</p>
    </div>

  </main>

  <script>
    let deck = [];
    let currentIndex = 0;
    let isFlipped = false;

    // DOM Elements
    const jsonInput = document.getElementById('jsonInput');
    const cardContainer = document.getElementById('cardContainer');
    const cardInner = document.getElementById('cardInner');
    const cardFront = document.getElementById('cardFront');
    const cardBack = document.getElementById('cardBack');
    const ratingBar = document.getElementById('ratingBar');
    const flipHint = document.getElementById('flipHint');
    const deckInfo = document.getElementById('deckInfo');
    const emptyState = document.getElementById('emptyState');
    const resetBtn = document.getElementById('resetBtn');

    // Load saved deck on initialization
    window.onload = () => {
      const savedDeck = localStorage.getItem('anki_deck_data');
      if (savedDeck) {
        deck = JSON.parse(savedDeck);
        startStudySession();
      }
    };

    // JSON File Upload
    jsonInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const rawData = JSON.parse(event.target.result);
          
          // Normalize card object structure with default SM-2 values
          deck = rawData.map(c => ({
            front: c.front || "",
            back: c.back || "",
            repetition: c.repetition || 0,
            interval: c.interval || 1,
            easeFactor: c.easeFactor || 2.5,
            dueDate: c.dueDate || new Date().toISOString()
          }));

          saveProgress();
          startStudySession();
        } catch (err) {
          alert("Invalid JSON file format.");
        }
      };
      reader.readAsText(file);
    });

    function saveProgress() {
      localStorage.setItem('anki_deck_data', JSON.stringify(deck));
    }

    function startStudySession() {
      if (!deck || deck.length === 0) return;

      // Filter due cards or sort by date
      const now = new Date();
      let dueCards = deck.filter(c => new Date(c.dueDate) <= now);

      if (dueCards.length === 0) {
        deckInfo.textContent = `Total cards: ${deck.length} (0 due right now)`;
        cardContainer.classList.add('hidden');
        ratingBar.classList.add('hidden');
        flipHint.classList.add('hidden');
        emptyState.classList.remove('hidden');
        resetBtn.classList.remove('hidden');
        return;
      }

      currentIndex = deck.indexOf(dueCards[0]);
      deckInfo.textContent = `Due cards remaining: ${dueCards.length} / ${deck.length}`;
      emptyState.classList.add('hidden');
      cardContainer.classList.remove('hidden');
      flipHint.classList.remove('hidden');
      resetBtn.classList.remove('hidden');

      showCard();
    }

    function showCard() {
      isFlipped = false;
      cardInner.classList.remove('rotate-y-180');
      ratingBar.classList.add('hidden');

      const card = deck[currentIndex];
      cardFront.innerHTML = card.front;
      cardBack.innerHTML = card.back;
    }

    // Card Flip Action
    cardInner.addEventListener('click', toggleFlip);
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !cardContainer.classList.contains('hidden')) {
        e.preventDefault();
        toggleFlip();
      }
    });

    function toggleFlip() {
      isFlipped = !isFlipped;
      cardInner.classList.toggle('rotate-y-180', isFlipped);
      if (isFlipped) {
        ratingBar.classList.remove('hidden');
      } else {
        ratingBar.classList.add('hidden');
      }
    }

    // SuperMemo-2 (SM-2) Spaced Repetition Logic
    function rateCard(quality) {
      const card = deck[currentIndex];
      
      // SM-2 Formula adjustments
      if (quality < 2) { // Again (failed)
        card.repetition = 0;
        card.interval = 1;
        card.easeFactor = Math.max(1.3, card.easeFactor - 0.2);
      } else { // Hard (2), Good (3), Easy (4)
        if (card.repetition === 0) {
          card.interval = 1;
        } else if (card.repetition === 1) {
          card.interval = 6;
        } else {
          card.interval = Math.round(card.interval * card.easeFactor);
        }

        card.repetition += 1;
        
        // Adjust ease factor
        if (quality === 2) card.easeFactor = Math.max(1.3, card.easeFactor - 0.15);
        if (quality === 4) card.easeFactor += 0.15;
      }

      // Calculate next due date
      const nextDate = new Date();
      nextDate.setDate(nextDate.getDate() + card.interval);
      card.dueDate = nextDate.toISOString();

      saveProgress();
      startStudySession();
    }

    // Clear Progress
    resetBtn.addEventListener('click', () => {
      if (confirm("Reset all learning progress for this deck?")) {
        localStorage.removeItem('anki_deck_data');
        location.reload();
      }
    });
  </script>
</body>
</html>
