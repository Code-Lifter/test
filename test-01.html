<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabata Workout & Weight Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen pb-10">

    <nav class="w-full p-4 border-b border-gray-700 mb-6">
        <a href="/" class="text-blue-400 hover:text-blue-300 flex items-center font-semibold max-w-md mx-auto">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            Home
        </a>
    </nav>

    <main class="max-w-md mx-auto px-4 space-y-8">
        
        <section class="bg-gray-800 rounded-xl p-6 shadow-lg border border-gray-700 text-center">
            <h1 class="text-2xl font-bold mb-2">Tabata Timer</h1>
            
            <div class="my-6">
                <p id="phaseDisplay" class="text-xl font-medium text-green-400 uppercase tracking-widest mb-2">Work</p>
                <div id="timeDisplay" class="text-7xl font-bold tabular-nums">20</div>
                <p class="text-gray-400 mt-3 text-lg">Round <span id="roundDisplay" class="font-bold text-white">1</span> / 8</p>
            </div>

            <div class="flex gap-3 justify-center mt-6">
                <button id="startBtn" class="flex-1 bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-4 rounded-lg transition">
                    Start
                </button>
                <button id="pauseBtn" class="flex-1 bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-3 px-4 rounded-lg transition hidden">
                    Pause
                </button>
                <button id="resetBtn" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-4 rounded-lg transition">
                    Reset
                </button>
            </div>
        </section>

        <section class="bg-gray-800 rounded-xl p-6 shadow-lg border border-gray-700">
            <h2 class="text-xl font-bold mb-4">Tabata Weight Calculator</h2>
            <p class="text-sm text-gray-400 mb-4">Enter your 1-Rep Max (1RM) for an exercise to find your ideal Tabata weight (50-60%).</p>
            
            <div class="flex flex-col gap-3">
                <label for="weightInput" class="text-sm font-medium">Your 1-Rep Max (lbs/kg)</label>
                <input type="number" id="weightInput" placeholder="e.g., 100" class="bg-gray-700 border border-gray-600 text-white rounded-lg p-3 focus:outline-none focus:border-blue-500">
                
                <div id="calcResult" class="mt-4 hidden bg-gray-900 p-4 rounded-lg border border-gray-600">
                    <p class="text-sm text-gray-400">Target Weight Range:</p>
                    <p id="weightRangeText" class="text-2xl font-bold text-blue-400 mt-1">--</p>
                </div>
            </div>
        </section>

    </main>

    <script>
        let timerInterval;
        let isRunning = false;
        
        let timeRemaining = 20;
        let currentRound = 1;
        let phase = 'Work'; 
        let maxRounds = 8;

        const timeDisplay = document.getElementById('timeDisplay');
        const phaseDisplay = document.getElementById('phaseDisplay');
        const roundDisplay = document.getElementById('roundDisplay');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const weightInput = document.getElementById('weightInput');
        const calcResult = document.getElementById('calcResult');
        const weightRangeText = document.getElementById('weightRangeText');

        function loadStorage() {
            const savedData = JSON.parse(localStorage.getItem('tabataApp'));
            if (savedData) {
                timeRemaining = savedData.timeRemaining;
                currentRound = savedData.currentRound;
                phase = savedData.phase;
                if (savedData.oneRepMax) {
                    weightInput.value = savedData.oneRepMax;
                    calculateWeight();
                }
            }
            updateUI();
        }

        function saveStorage() {
            const dataToSave = {
                timeRemaining,
                currentRound,
                phase,
                oneRepMax: weightInput.value
            };
            localStorage.setItem('tabataApp', JSON.stringify(dataToSave));
        }

        function updateUI() {
            timeDisplay.textContent = timeRemaining;
            roundDisplay.textContent = currentRound;
            phaseDisplay.textContent = phase;
            
            if (phase === 'Work') {
                phaseDisplay.className = "text-xl font-medium text-green-400 uppercase tracking-widest mb-2";
                timeDisplay.className = "text-7xl font-bold tabular-nums text-white";
            } else if (phase === 'Rest') {
                phaseDisplay.className = "text-xl font-medium text-red-400 uppercase tracking-widest mb-2";
                timeDisplay.className = "text-7xl font-bold tabular-nums text-red-200";
            } else {
                phaseDisplay.className = "text-xl font-medium text-blue-400 uppercase tracking-widest mb-2";
            }
        }

        function toggleButtons() {
            if (isRunning) {
                startBtn.classList.add('hidden');
                pauseBtn.classList.remove('hidden');
            } else {
                startBtn.classList.remove('hidden');
                pauseBtn.classList.add('hidden');
            }
        }

        function tick() {
            timeRemaining--;
            
            if (timeRemaining < 0) {
                if (phase === 'Work') {
                    phase = 'Rest';
                    timeRemaining = 10;
                } else {
                    currentRound++;
                    if (currentRound > maxRounds) {
                        finishWorkout();
                        return;
                    }
                    phase = 'Work';
                    timeRemaining = 20;
                }
            }
            
            updateUI();
            saveStorage();
        }

        function finishWorkout() {
            clearInterval(timerInterval);
            isRunning = false;
            phase = 'Done!';
            timeRemaining = 0;
            updateUI();
            toggleButtons();
            startBtn.disabled = true;
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');
            saveStorage();
        }

        startBtn.addEventListener('click', () => {
            if (!isRunning && phase !== 'Done!') {
                isRunning = true;
                timerInterval = setInterval(tick, 1000);
                toggleButtons();
            }
        });

        pauseBtn.addEventListener('click', () => {
            isRunning = false;
            clearInterval(timerInterval);
            toggleButtons();
            saveStorage();
        });

        resetBtn.addEventListener('click', () => {
            isRunning = false;
            clearInterval(timerInterval);
            timeRemaining = 20;
            currentRound = 1;
            phase = 'Work';
            
            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            
            updateUI();
            toggleButtons();
            saveStorage();
        });

        function calculateWeight() {
            const oneRm = parseFloat(weightInput.value);
            if (oneRm > 0) {
                const lowerBound = Math.round(oneRm * 0.5);
                const upperBound = Math.round(oneRm * 0.6);
                weightRangeText.textContent = `${lowerBound} - ${upperBound}`;
                calcResult.classList.remove('hidden');
            } else {
                calcResult.classList.add('hidden');
            }
            saveStorage();
        }

        weightInput.addEventListener('input', calculateWeight);

        loadStorage();
    </script>
</body>
</html>
