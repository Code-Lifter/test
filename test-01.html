<style>
/* Layout: an index-card desk. One working column of ruled cards on a cool desk surface; the review card is the only thing that gets the red header rule. */
:root {
  --paper: #ECEFF4;
  --card: #FFFFFF;
  --sunk: #F4F6FA;
  --ink: #161C2E;
  --ink-2: #454F68;
  --muted: #687290;
  --line: #D6DBE5;
  --rule: #D5DFF0;
  --rule-red: #D9483F;
  --accent: #2747A8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2E8F8;
  --new: #2B66C9;
  --learn: #C2410C;
  --due: #17803D;
  --young: #7CB342;
  --mature: #2E6B34;
  --again: #C8372D;
  --hard: #A86A12;
  --good: #2E8540;
  --easy: #2B66C9;
  --f1: #D9483F; --f2: #D9822B; --f3: #2E8540; --f4: #2B66C9;
  --occ-other: #FFE59A; --occ-other-b: #CFA640; --occ-active: #E4574B;
  --hl-kw: #8E3BB4; --hl-str: #17803D; --hl-num: #B5541A; --hl-com: #7A8299; --hl-fn: #2747A8;
  --shadow: 0 1px 0 rgba(22, 28, 46, .05), 0 10px 28px -14px rgba(22, 28, 46, .28);
  --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --card-scale: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10131A; --card: #1A1E29; --sunk: #151922; --ink: #E8EBF3; --ink-2: #B5BCCD; --muted: #8B93A9;
    --line: #2A3141; --rule: #222C40; --rule-red: #E2675D; --accent: #93AAF3; --accent-ink: #0C1330; --accent-soft: #212B46;
    --new: #74A6F4; --learn: #F28B4C; --due: #5DC47C; --young: #A5D46A; --mature: #4FA35B;
    --again: #EF6B60; --hard: #E1A846; --good: #5DC47C; --easy: #74A6F4;
    --hl-kw: #D29BF0; --hl-str: #7FD49A; --hl-num: #F2A97A; --hl-com: #8A92A8; --hl-fn: #9DB4F6;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 30px -14px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10131A; --card: #1A1E29; --sunk: #151922; --ink: #E8EBF3; --ink-2: #B5BCCD; --muted: #8B93A9;
  --line: #2A3141; --rule: #222C40; --rule-red: #E2675D; --accent: #93AAF3; --accent-ink: #0C1330; --accent-soft: #212B46;
  --new: #74A6F4; --learn: #F28B4C; --due: #5DC47C; --young: #A5D46A; --mature: #4FA35B;
  --again: #EF6B60; --hard: #E1A846; --good: #5DC47C; --easy: #74A6F4;
  --hl-kw: #D29BF0; --hl-str: #7FD49A; --hl-num: #F2A97A; --hl-com: #8A92A8; --hl-fn: #9DB4F6;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 30px -14px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.2rem); line-height: 1.1; letter-spacing: -.01em; text-wrap: balance; }
.h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1.25; text-wrap: balance; }
.eyebrow { font: 600 .72rem/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.sub { color: var(--ink-2); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.hint { color: var(--muted); font-size: .85rem; }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in oklab, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; letter-spacing: -.01em; display: inline-flex; align-items: center; gap: .5rem; color: var(--ink); }
.navtabs { display: flex; gap: .15rem; overflow-x: auto; scrollbar-width: none; }
.navtabs::-webkit-scrollbar { display: none; }
.navtab { padding: .45rem .7rem; border-radius: 6px; font-weight: 700; font-size: .9rem; color: var(--ink-2); white-space: nowrap; }
.navtab:hover { background: var(--sunk); color: var(--ink); }
.navtab[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; padding: .5rem .85rem; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 700 .88rem/1.2 var(--font-body); cursor: pointer; transition: background .15s, border-color .15s, color .15s; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { border-color: var(--accent); filter: brightness(1.08); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--sunk); border-color: transparent; color: var(--ink); }
.btn-danger { color: var(--again); }
.btn-lg { padding: .8rem 1.4rem; font-size: 1rem; }
.btn-sm { padding: .3rem .6rem; font-size: .8rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.iconbtn { display: inline-grid; place-items: center; width: 2rem; height: 2rem; border-radius: 6px; color: var(--muted); }
.iconbtn:hover { background: var(--sunk); color: var(--ink); }
.iconbtn svg, .btn svg { width: 1.05rem; height: 1.05rem; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.input, .select, .textarea { width: 100%; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: .5rem .65rem; font: 400 .95rem/1.4 var(--font-body); }
.textarea { font-family: var(--font-mono); font-size: .85rem; resize: vertical; min-height: 4.5rem; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.label { display: block; font-weight: 700; font-size: .82rem; color: var(--ink-2); margin-bottom: .3rem; }
.check { display: flex; align-items: center; gap: .5rem; font-size: .92rem; }
.check input { width: 1rem; height: 1rem; accent-color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: .25rem; padding: .1rem .45rem; border-radius: 999px; font: 600 .7rem/1.4 var(--font-mono); letter-spacing: .03em; background: var(--sunk); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.chip-accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
.section { display: flex; flex-direction: column; gap: .75rem; }
kbd { font: 500 .75rem var(--font-mono); background: var(--sunk); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 .3rem; }

/* deck list */
.decktable { width: 100%; border-collapse: collapse; }
.decktable th { font: 600 .7rem var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: .6rem .75rem; text-align: right; border-bottom: 1px solid var(--line); }
.decktable th:first-child { text-align: left; }
.decktable td { padding: .55rem .75rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
.decktable tr:last-child td { border-bottom: 0; }
.decktable tr:hover td { background: var(--sunk); }
.deckname { font-weight: 700; text-align: left; color: var(--ink); }
.deckname:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.n-new { color: var(--new); } .n-learn { color: var(--learn); } .n-due { color: var(--due); }
.n-zero { color: var(--muted); opacity: .55; }
.twisty { width: 1.4rem; height: 1.4rem; display: inline-grid; place-items: center; border-radius: 4px; color: var(--muted); transition: transform .15s; }
.twisty[aria-expanded="true"] { transform: rotate(90deg); }
.twisty-sp { width: 1.4rem; display: inline-block; }

/* index-card sheet */
.sheet { position: relative; background-color: var(--card); border-radius: 6px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.sheet-ruled {
  background-image: linear-gradient(var(--rule-red), var(--rule-red)), repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
  background-size: 100% 2px, 100% 100%; background-position: 0 46px, 0 46px; background-repeat: no-repeat, repeat;
}
.stamp { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: .4rem .9rem; border: 2px solid var(--rule-red); border-radius: 4px; color: var(--rule-red); font: 600 .72rem/1.1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; transform: rotate(-4deg); }
.stamp b { font-size: 1.3rem; letter-spacing: .06em; }

/* review */
.rv { display: flex; flex-direction: column; min-height: calc(100dvh - 60px); }
.rv-stage { flex: 1; display: flex; flex-direction: column; padding-block: 1rem 1.5rem; }
.rv-sheet { flex: 1; min-height: 280px; padding: 3.75rem clamp(1rem, 4vw, 3rem) 2rem; }
.rv-flag { position: absolute; top: 12px; right: 14px; width: 12px; height: 18px; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%); }
.rv-meta { position: absolute; top: 13px; left: 16px; font: 600 .7rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.rv-bar { position: sticky; bottom: 0; background: color-mix(in oklab, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding-top: .75rem; padding-bottom: calc(.75rem + env(safe-area-inset-bottom, 0px)); }
.cnt { font: 600 1rem var(--font-mono); font-variant-numeric: tabular-nums; padding: 0 .1rem; }
.cnt.cur { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.rate { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: .5rem .25rem .6rem; border: 1px solid var(--line); border-top: 3px solid var(--rc); background: var(--card); border-radius: 6px; font: 700 .95rem var(--font-body); color: var(--ink); cursor: pointer; }
.rate:hover { background: color-mix(in oklab, var(--rc) 10%, var(--card)); }
.rate small { font: 500 .74rem var(--font-mono); color: var(--muted); }
.rate[data-g="1"] { --rc: var(--again); } .rate[data-g="2"] { --rc: var(--hard); } .rate[data-g="3"] { --rc: var(--good); } .rate[data-g="4"] { --rc: var(--easy); }

/* card content (what the deck author controls) */
.card-content { font-family: var(--font-body); font-size: calc(1.3rem * var(--card-scale)); line-height: 1.55; color: var(--ink); text-align: center; overflow-wrap: anywhere; }
.card-content p { margin: .45em 0; }
.card-content h1 { font-size: 1.6em; font-weight: 700; margin: .3em 0; }
.card-content h2 { font-size: 1.35em; font-weight: 700; margin: .3em 0; }
.card-content h3 { font-size: 1.15em; font-weight: 700; margin: .3em 0; }
.card-content ul, .card-content ol { text-align: left; display: inline-block; padding-left: 1.3em; margin: .4em 0; }
.card-content ul { list-style: disc; } .card-content ol { list-style: decimal; }
.card-content table { margin: .5em auto; border-collapse: collapse; font-size: .85em; }
.card-content th, .card-content td { border: 1px solid var(--line); padding: .3em .6em; }
.card-content img, .card-content video { max-width: 100%; height: auto; display: inline-block; border-radius: 4px; }
.card-content audio { display: block; margin: .6em auto; max-width: 100%; }
.card-content a { color: var(--accent); text-decoration: underline; }
.card-content strong, .card-content b { font-weight: 700; }
.card-content em, .card-content i { font-style: italic; }
.card-content blockquote { border-left: 3px solid var(--line); padding-left: .8em; color: var(--ink-2); text-align: left; }
.card-content hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
.card-content hr#answer { border-top: 2px dashed var(--line); margin: 1.4em 0; }
.card-content pre { text-align: left; background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: .8rem 1rem; overflow-x: auto; font-size: .72em; line-height: 1.55; margin: .6em auto; max-width: 42rem; }
.card-content code { font-family: var(--font-mono); font-size: .86em; background: var(--sunk); padding: .05em .3em; border-radius: 3px; }
.card-content pre code { background: none; padding: 0; font-size: 1em; }
.card-content mjx-container { color: inherit; overflow-x: auto; overflow-y: hidden; max-width: 100%; }
.card-content mjx-container[display="true"] { display: block; text-align: center; margin: .6em 0; }
.cloze { font-weight: 700; color: var(--accent); }
.extra { margin-top: 1.1em; font-size: .82em; color: var(--ink-2); }
.tpl-err { font: 500 .8rem var(--font-mono); color: var(--again); }
.tts-btn { display: inline-grid; place-items: center; width: 2rem; height: 2rem; margin: 0 .3rem; vertical-align: middle; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--accent); cursor: pointer; }
.tts-btn svg { width: 1rem; height: 1rem; }
.hint-btn { font-size: .8em; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.typeans { display: block; width: min(100%, 26rem); margin: 1em auto 0; text-align: center; font: 500 1rem var(--font-mono); padding: .6rem .8rem; border: 1px solid var(--line); border-radius: 7px; background: var(--sunk); color: var(--ink); }
.typeans:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.typecmp { display: inline-flex; flex-direction: column; gap: .2em; font: 500 1rem var(--font-mono); margin-top: .4em; }
.typecmp .ok { background: color-mix(in oklab, var(--good) 22%, transparent); }
.typecmp .bad { background: color-mix(in oklab, var(--again) 26%, transparent); text-decoration: line-through; }
.typecmp .miss { background: color-mix(in oklab, var(--hard) 28%, transparent); }
.typecmp .arrow { color: var(--muted); font-size: .8em; }
.hljs-keyword, .hljs-built_in, .hljs-literal, .hljs-selector-tag { color: var(--hl-kw); }
.hljs-string, .hljs-attr, .hljs-template-tag, .hljs-regexp { color: var(--hl-str); }
.hljs-number, .hljs-symbol { color: var(--hl-num); }
.hljs-comment, .hljs-quote { color: var(--hl-com); font-style: italic; }
.hljs-title, .hljs-title.function_, .hljs-function, .hljs-property { color: var(--hl-fn); }

/* image occlusion */
.occ { position: relative; display: inline-block; max-width: 100%; line-height: 0; vertical-align: top; }
.occ img { display: block; max-width: 100%; height: auto; border-radius: 4px; }
.occ-m { position: absolute; border-radius: 3px; display: flex; align-items: center; justify-content: center; font: 700 .85rem/1 var(--font-body); color: #3B2A00; overflow: hidden; }
.occ-m.ellipse { border-radius: 50%; }
.occ-other { background: var(--occ-other); border: 1px solid var(--occ-other-b); cursor: pointer; transition: opacity .15s; }
.occ-other.peek { opacity: .12; }
.occ-active { background: var(--occ-active); border: 2px solid #9E2A20; color: #FFFFFF; }
.occ-active::after { content: "?"; font-size: 1rem; }
.occ-reveal { background: transparent; border: 2px solid var(--occ-active); box-shadow: 0 0 0 3px rgba(228, 87, 75, .25); }
.occ-header { font-weight: 700; margin-bottom: .6em; }

/* occlusion editor */
.occ-edit { position: relative; display: inline-block; max-width: 100%; line-height: 0; touch-action: none; cursor: crosshair; user-select: none; }
.occ-edit img { display: block; max-width: 100%; height: auto; pointer-events: none; border-radius: 4px; }
.occ-em { position: absolute; background: color-mix(in oklab, var(--occ-other) 75%, transparent); border: 2px solid var(--occ-other-b); border-radius: 3px; display: grid; place-items: center; font: 700 .8rem var(--font-mono); color: #3B2A00; cursor: pointer; }
.occ-em.sel { border-color: var(--occ-active); background: color-mix(in oklab, var(--occ-active) 35%, transparent); color: #fff; }
.occ-em.ellipse { border-radius: 50%; }
.occ-draft { position: absolute; border: 2px dashed var(--occ-active); background: rgba(228, 87, 75, .15); pointer-events: none; }

/* browse */
.btable { width: 100%; border-collapse: collapse; font-size: .88rem; }
.btable th { position: sticky; top: 0; background: var(--card); font: 600 .68rem var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: .55rem .6rem; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; }
.btable th[aria-sort] { color: var(--accent); }
.btable td { padding: .45rem .6rem; border-bottom: 1px solid var(--line); white-space: nowrap; max-width: 22rem; overflow: hidden; text-overflow: ellipsis; }
.btable tbody tr { cursor: pointer; }
.btable tbody tr:hover td { background: var(--sunk); }
.btable tr.is-susp td { color: var(--muted); background: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in oklab, var(--hard) 8%, transparent) 6px 12px); }
.btable tr.is-sel td { background: var(--accent-soft); }
.flagdot { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; }

/* stats */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: 1rem; }
.bars { display: grid; grid-template-columns: auto 1fr; gap: .4rem; }
.bars-y { display: flex; flex-direction: column; justify-content: space-between; font: 500 .68rem var(--font-mono); color: var(--muted); text-align: right; height: var(--h); }
.bars-plot { position: relative; height: var(--h); display: flex; align-items: flex-end; gap: 2px; border-bottom: 1px solid var(--line); }
.bars-grid { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); pointer-events: none; }
.bar-col { flex: 1; height: 100%; display: flex; align-items: flex-end; min-width: 0; }
.bar { width: 100%; background: var(--bc, var(--accent)); border-radius: 3px 3px 0 0; min-height: 0; }
.bar-col:hover .bar { filter: brightness(1.15); }
.bars-x { display: flex; justify-content: space-between; font: 500 .68rem var(--font-mono); color: var(--muted); margin-left: var(--yw, 2rem); padding-top: .25rem; }
.stack { display: flex; gap: 2px; height: 22px; border-radius: 4px; overflow: hidden; }
.stack > div { height: 100%; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .35rem 1rem; font-size: .85rem; }

function startStudy(did) {

function nextNormal(s) {

  let useNew;
  if (!q.nw.length) useNew = false; else if (!q.rev.length) useNew = true;
  else if (q.p.newMix === 'before') useNew = true; else if (q.p.newMix === 'after') useNew = false;
  else { const ratio = Math.floor(q.rev.length / q.nw.length) + 1; useNew = s.count % ratio === ratio - 1; }

}
function nextFiltered(s) {

  if (s.preview) {

    if (fresh.length) return fresh.find(c => c.id !== s.lastId) || fresh[0];
    const ag = cands.filter(c => s.again.has(c.id)).sort((a, b) => s.again.get(a.id) - s.again.get(b.id));
    return ag.find(c => c.id !== s.lastId) || ag[0] || null;

  if (lrn.length && lrn[0].due <= now && lrn[0].id !== s.lastId) return lrn[0];
  const fresh = cands.filter(c => !s.seen.has(c.id));
  if (fresh.length) return fresh.find(c => c.id !== s.lastId) || fresh[0];

function buildFiltered(deck) {

function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }

    <div class="bars-plot"><div class="bars-grid" style="top:0"></div><div class="bars-grid" style="top:50%"></div>

}
function renderStats() {

  // reviews per day
  const perDay = new Array(R).fill(0), perDayMs = new Array(R).fill(0);
  for (const l of logs) { const d = today - dayOf(l.t); if (d >= 0 && d < R) { perDay[R - 1 - d]++; perDayMs[R - 1 - d] += l.ms || 0; } }
  // forecast
  const F = 30, fc = new Array(F).fill(0);
  for (const c of cards) { if (c.susp || c.type === 'new') continue; let d = c.type === 'review' ? c.due - today : dayOf(c.due) - today; if (d < 0) d = 0; if (d < F) fc[d]++; }
  // counts
  const cnt = { new: 0, learn: 0, young: 0, mature: 0, susp: 0 };
  for (const c of cards) { if (c.susp) cnt.susp++; else if (c.type === 'new') cnt.new++; else if (c.type !== 'review') cnt.learn++; else if (c.ivl >= 21) cnt.mature++; else cnt.young++; }
  const total = cards.length || 1;
  // retention
  const retRow = (label, from, to = Infinity) => {
    const ls = logs.filter(l => l.t >= from && l.t < to && l.kind === 'review'); const y = ls.filter(l => (l.lastIvl || 0) < 21), m = ls.filter(l => (l.lastIvl || 0) >= 21);
    const pct = a => a.length ? `${(a.filter(l => l.g > 1).length / a.length * 100).toFixed(1)}%` : '—';
    return `<tr><td>${label}</td><td>${pct(y)}</td><td>${pct(m)}</td><td>${pct(ls)}</td><td>${ls.length}</td></tr>`;
  };
  // hourly
  const hours = new Array(24).fill(0), hoursPass = new Array(24).fill(0);
  for (const l of logs) { if (l.t < dayStartTs(today - 90)) continue; const h = new Date(l.t).getHours(); hours[h]++; if (l.g > 1) hoursPass[h]++; }
  // intervals
  const buckets = [['1d', 1, 1], ['2–3d', 2, 3], ['4–7d', 4, 7], ['1–2w', 8, 14], ['2–4w', 15, 30], ['1–3mo', 31, 90], ['3–6mo', 91, 182], ['6–12mo', 183, 365], ['1y+', 366, Infinity]];
  const ivlCounts = buckets.map(([, a, b]) => cards.filter(c => c.type === 'review' && !c.susp && c.ivl >= a && c.ivl <= b).length);
  // heatmap (26 or 52 weeks)
  const W = 53; const dayCounts = new Map(); for (const l of logs) { const d = dayOf(l.t); dayCounts.set(d, (dayCounts.get(d) || 0) + 1); }
  const todayDow = dayDate(today).getUTCDay(); const startDay = today - todayDow - (W - 1) * 7;
  const vals = [...dayCounts.values()].sort((a, b) => a - b); const q = p => vals.length ? vals[Math.min(vals.length - 1, Math.floor(p * vals.length))] : 1;
  const lv = n => !n ? 0 : n <= q(.25) ? 1 : n <= q(.5) ? 2 : n <= q(.8) ? 3 : 4;
  let heat = '', months = '';
  for (let w = 0; w < W; w++) {
    const first = startDay + w * 7; const dd = dayDate(first);
    months += `<span style="grid-column:${w + 1}">${dd.getUTCDate() <= 7 ? dd.toLocaleDateString(undefined, { month: 'short', timeZone: 'UTC' }) : ''}</span>`;
    for (let i = 0; i < 7; i++) { const d = first + i; if (d > today) { heat += '<i style="visibility:hidden"></i>'; continue; } const n = dayCounts.get(d) || 0; heat += `<i data-l="${lv(n)}" class="${d === today ? 'today' : ''}" data-tip="${dayLabel(d, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })}: ${plural(n, 'review')}"></i>`; }
  }
  const activeDays = [...dayCounts.keys()].filter(d => d > today - 365).length;
  // retrievability
  const rs = cards.filter(c => c.type === 'review' && !c.susp).map(c => retrievability(c, today)).filter(x => x != null);
  const avgR = rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : null;
  const tipDay = (i, nDays, extra) => `${dayLabel(today - (nDays - 1 - i), { weekday: 'short', day: 'numeric', month: 'short' })}\n${extra}`;
  const decks = sortedDecks().filter(d => !d.filtered);
  const seg = (k, color, label) => cnt[k] ? `<div style="flex:${cnt[k]};background:${color}" data-tip="${label}: ${cnt[k]} (${(cnt[k] / total * 100).toFixed(1)}%)"></div>` : '';
  v.innerHTML = `<div class="flex flex-col gap-5">
    <div class="flex flex-wrap items-end justify-between gap-3"><h1 class="h1">Statistics</h1>
      <div class="flex flex-wrap gap-2"><select id="st-deck" class="select" style="width:auto" aria-label="Deck"><option value="all">Whole collection</option>${decks.map(d => `<option value="${d.id}" ${S.did === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select>
      <select id="st-range" class="select" style="width:auto" aria-label="Range">${[[30, '1 month'], [90, '3 months'], [365, '1 year']].map(([n, l]) => `<option value="${n}" ${R === n ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
    <div class="panel grid grid-cols-2 gap-4 p-4 sm:grid-cols-4">
      <div class="kpi"><b>${tl.length}</b><span>reviews today</span></div>
      <div class="kpi"><b>${fmtDuration(tl.reduce((a, l) => a + (l.ms || 0), 0))}</b><span>time today</span></div>
      <div class="kpi"><b>${tRev ? (tPass / tRev * 100).toFixed(0) + '%' : '—'}</b><span>correct on reviews today</span></div>
      <div class="kpi"><b>${studyStreak()}</b><span>day streak · ${activeDays} active days this year</span></div>
    </div>
    <div class="panel flex flex-col gap-3 p-4"><div class="flex flex-wrap items-baseline justify-between gap-2"><h2 class="h2">Review calendar</h2><span class="hint">Each square is a day. Today has a red outline.</span></div>
      <div class="overflow-x-auto pb-1"><div class="grid gap-1" style="width:max-content"><div class="hint mono" style="display:grid;grid-auto-flow:column;grid-template-columns:repeat(${W},11px);gap:3px;font-size:.62rem;white-space:nowrap">${months}</div><div class="heat">${heat}</div></div></div></div>
    <div class="stat-grid">
      <div class="panel flex flex-col gap-3 p-4"><h2 class="h2">Due in the next 30 days</h2><p class="hint">Overdue cards are counted as due today. Learning cards included.</p>
        ${barChart({ values: fc, tips: fc.map((n, i) => `${i === 0 ? 'Today' : dayLabel(today + i, { weekday: 'short', day: 'numeric', month: 'short' })}\n${plural(n, 'card')} due`), color: 'var(--due)', xStart: 'Today', xMid: '+15d', xEnd: '+29d' })}
        <p class="hint mono">${fc.reduce((a, b) => a + b, 0)} due in 30 days · ${(fc.reduce((a, b) => a + b, 0) / F).toFixed(1)} a day on average</p></div>
      <div class="panel flex flex-col gap-3 p-4"><h2 class="h2">Reviews per day</h2><p class="hint">Last ${R} days, all card types.</p>
        ${barChart({ values: perDay, tips: perDay.map((n, i) => tipDay(i, R, `${plural(n, 'review')} · ${fmtDuration(perDayMs[i])}`)), xStart: `−${R - 1}d`, xMid: `−${Math.round(R / 2)}d`, xEnd: 'Today' })}
        <p class="hint mono">${perDay.reduce((a, b) => a + b, 0)} reviews · ${(perDay.reduce((a, b) => a + b, 0) / R).toFixed(1)} a day · ${fmtDuration(perDayMs.reduce((a, b) => a + b, 0))} total</p></div>
      <div class="panel flex flex-col gap-3 p-4"><h2 class="h2">Card counts</h2>
        <div class="stack">${seg('new', 'var(--new)', 'New')}${seg('learn', 'var(--learn)', 'Learning')}${seg('young', 'var(--young)', 'Young')}${seg('mature', 'var(--mature)', 'Mature')}${seg('susp', 'var(--muted)', 'Suspended')}${cards.length ? '' : '<div style="flex:1;background:var(--sunk)"></div>'}</div>
        <div class="legend">${[['new', 'var(--new)', 'New'], ['learn', 'var(--learn)', 'Learning'], ['young', 'var(--young)', 'Young (under 21d)'], ['mature', 'var(--mature)', 'Mature (21d+)'], ['susp', 'var(--muted)', 'Suspended']].map(([k, c, l]) => `<div><i style="background:${c}"></i>${l} <span class="mono text-muted">${cnt[k]}</span></div>`).join('')}</div>
        <p class="hint mono">${plural(cards.length, 'card')}${avgR != null ? ` · estimated recall right now ${(avgR * 100).toFixed(0)}% (FSRS)` : ''}</p></div>
      <div class="panel flex flex-col gap-3 p-4"><h2 class="h2">True retention</h2><p class="hint">Share of review cards you passed (Hard, Good or Easy).</p>
        <div class="overflow-x-auto"><table class="rtable"><thead><tr><th></th><th>Young</th><th>Mature</th><th>All</th><th>Count</th></tr></thead><tbody>
        ${retRow('Today', startToday)}${retRow('Yesterday', dayStartTs(today - 1), startToday)}${retRow('Last 7 days', dayStartTs(today - 6))}${retRow('Last 30 days', dayStartTs(today - 29))}${retRow('Last year', dayStartTs(today - 364))}</tbody></table></div></div>
      <div class="panel flex flex-col gap-3 p-4"><h2 class="h2">Time of day</h2><p class="hint">Reviews by hour over the last 90 days. Hover for your pass rate.</p>
        ${barChart({ values: hours, tips: hours.map((n, h) => `${String(h).padStart(2, '0')}:00–${String(h).padStart(2, '0')}:59\n${plural(n, 'review')}${n ? ` · ${(hoursPass[h] / n * 100).toFixed(0)}% passed` : ''}`), color: 'var(--easy)', xStart: '00:00', xMid: '12:00', xEnd: '23:00' })}</div>
      <div class="panel flex flex-col gap-3 p-4"><h2 class="h2">Intervals</h2><p class="hint">How far apart your review cards are spaced.</p>
        ${barChart({ values: ivlCounts, tips: ivlCounts.map((n, i) => `${buckets[i][0]}\n${plural(n, 'card')}`), color: 'var(--mature)', xStart: buckets[0][0], xMid: buckets[4][0], xEnd: buckets[8][0] })}</div>
    </div>
  </div>`;
  $('#st-deck').onchange = e => { S.did = e.target.value; renderStats(); };
  $('#st-range').onchange = e => { S.range = +e.target.value; renderStats(); };
}

function editNoteTypeDialog(id) {
  const nt = col.noteTypes[id];
  openModal({ title: `Note type: ${nt.name}`, wide: true,
    body: `<p class="hint">Edit the definition as JSON. Field and template changes apply to all ${plural(Object.values(col.notes).filter(n => n.typeId === id).length, 'note')} of this type. Removing a template deletes its cards.</p><textarea id="nt-json" class="textarea" rows="16" spellcheck="false">${esc(JSON.stringify({ name: nt.name, fields: nt.fields, templates: nt.templates, css: nt.css, markdown: nt.markdown }, null, 2))}</textarea>`,
    actions: [{ label: 'Cancel' }, { label: 'Save', primary: true, onClick: m => {
      let d; try { d = JSON.parse($('#nt-json', m).value); } catch (e) { toast('That is not valid JSON'); return false; }
      if (!Array.isArray(d.fields) || !d.fields.length || !Array.isArray(d.templates) || !d.templates.length) { toast('Needs at least one field and one template'); return false; }
      const oldFields = nt.fields;
      Object.assign(nt, { name: String(d.name || nt.name), fields: d.fields.map(String), templates: d.templates.map((t, i) => ({ name: t.name || `Card ${i + 1}`, front: String(t.front || ''), back: String(t.back || '') })), css: String(d.css || ''), markdown: d.markdown });
      for (const n of Object.values(col.notes)) if (n.typeId === id) { const f = {}; nt.fields.forEach((k, i) => f[k] = n.fields[k] ?? n.fields[oldFields[i]] ?? ''); n.fields = f; syncCards(n); }
      save(); toast('Note type saved'); renderSettings();
    } }] });
}

  'delete-deck': b => deleteDeck(b.dataset.did),
  'filtered-rebuild': b => { const n = buildFiltered(col.decks[b.dataset.did]); save(); toast(`Rebuilt with ${plural(n, 'card')}`); renderOverview(); },
  'filtered-empty': b => { col.decks[b.dataset.did].filtered.cids = []; save(); toast('Emptied. Cards are back in their home decks.'); renderOverview(); },
  'filtered-edit': b => filteredDialog(b.dataset.did),
  study: b => startStudy(b.dataset.did),
  'end-study': () => { const did = ui.sess?.did; ui.sess = null; if (did && col.decks[did]) openOverview(did); else go('decks'); },
  reveal: () => reveal(),
  rate: b => answer(+b.dataset.g),
  undo: () => undo(),
  replay: () => { const h = $('#rv-card'); if (h) playSequence(sideMedia(h, ui.sess?.revealed ? 'a' : 'q')); },
  'flag-menu': () => flagMenu(),
  'more-menu': () => moreMenu(),
  'edit-current': () => { const c = ui.sess?.card; if (c) editNoteDialog(c.nid, r => { if (r === 'deleted') nextAndRender(); else renderReview(); }); },
  'add-preview': () => { readEditor($('#add-form'), ui.add); if (!ui.add.did) return toast('Choose a deck first.'); previewNoteCards(ui.add); },
  'search-help': () => openModal({ title: 'Search syntax', wide: true, body: `<div class="docs"><table><tbody>${[
    ['dog', 'Notes containing "dog" in any field (use * as a wildcard)'], ['"two words"', 'An exact phrase'], ['front:dog', 'Field "Front" contains dog'],
    ['deck:Spanish', 'Cards in Spanish and its subdecks; deck:"Exercise Science::Anatomy" for names with spaces'], ['tag:verbs', 'Tagged verbs (tag:verbs* for any tag starting with verbs)'],
    ['is:new · is:learn · is:review · is:due', 'Card state'], ['is:suspended · is:buried · is:leech', 'Suspended, buried, or tagged leech'], ['flag:1', 'Red flag (2 orange, 3 green, 4 blue, 0 none)'],
    ['rated:7 · rated:7:1', 'Answered in the last 7 days · answered Again in the last 7 days'], ['added:3', 'Added in the last 3 days'],
    ['prop:ivl>=30', 'Interval of 30 days or more (also due, reps, lapses, ease, s, d, r)'], ['prop:due<=2', 'Due within 2 days (negative means overdue)'],
    ['note:Cloze · card:2', 'Note type, card template name or number'], ['-tag:done', 'Put - in front of any term to exclude it']
  ].map(([a, b]) => `<tr><td><code>${esc(a)}</code></td><td>${esc(b)}</td></tr>`).join('')}</tbody></table><p class="hint mt-2">All terms must match. Combine them freely, e.g. <code>deck:Anatomy is:review prop:lapses&gt;2 -is:suspended</code>.</p></div>`, actions: [{ label: 'Close', primary: true }] }),
  'browse-more': () => { ui.browse.limit += 200; renderBrowse(); },
  'backup-export': () => offerText('Export backup', `retain-backup-${new Date().toISOString().slice(0, 10)}.json`, backupJson(), 'This file holds all decks, notes, note types, options and review history. Import it on another device with Restore from backup, or by dropping it on the page.'),
  'backup-import': () => $('#file-backup').click(),
  'load-sample': () => { const r = importDeckData(structuredClone(SAMPLE_DECK), 'Sample'); showImportReport(r, 'the sample deck'); },
  'edit-nt': b => editNoteTypeDialog(b.dataset.id),
  wipe: () => openModal({ title: 'Delete everything?', body: `<p>This removes every deck, note, card, option preset and review in this browser. It can't be undone.</p><label class="label" for="wipe-confirm">Type DELETE to confirm</label><input id="wipe-confirm" class="input mono" autocomplete="off">`, actions: [{ label: 'Cancel' }, { label: 'Delete everything', primary: true, danger: true, onClick: m => { if ($('#wipe-confirm', m).value.trim() !== 'DELETE') { toast('Type DELETE to confirm'); return false; } col = newCollection(); rebuildIndex(); applyTheme(); save(true); ui.add = null; toast('All data deleted'); go('decks'); } }] }),
};
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]'); if (nav) { e.preventDefault(); go(nav.dataset.nav); return; }
  const a = e.target.closest('[data-action]'); if (a && ACTIONS[a.dataset.action]) { e.preventDefault(); ACTIONS[a.dataset.action](a, e); return; }
  const tb = e.target.closest('.tts-btn'); if (tb) { e.preventDefault(); stopAudio(); speak(tb.dataset.text, tb.dataset.lang, +tb.dataset.rate || 1); return; }
  const hb = e.target.closest('.hint-btn'); if (hb && hb.parentElement.classList.contains('hint')) { hb.hidden = true; hb.nextElementSibling.hidden = false; return; }
  const om = e.target.closest('.occ .occ-other'); if (om && ui.sess?.revealed) om.classList.toggle('peek');
});
document.addEventListener('keydown', e => {
  if (ui.view === 'decks' && e.key === ' ' && !e.target.closest('input,textarea,select,button') && !$('#modal-root').children.length) { return; }
  if (ui.view === 'overview' && (e.key === ' ' || e.key === 'Enter') && !e.target.closest('input,textarea,select,button,a') && !$('#modal-root').children.length) { const b = $('[data-action="study"]'); if (b) { e.preventDefault(); b.click(); } return; }
  if (ui.view !== 'review' || !ui.sess || $('#modal-root').children.length) return;
  if (e.target.closest('input,textarea,select')) return;
  const s = ui.sess; const k = e.key;
  if ((e.ctrlKey || e.metaKey) && ['1', '2', '3', '4'].includes(k)) { e.preventDefault(); return setFlag(+k); }
  if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'z') { e.preventDefault(); return undo(); }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (k === 'Escape') return ACTIONS['end-study']();
  if (!s.card) { if (k.toLowerCase() === 'z') undo(); return; }
  if (k === ' ' || k === 'Enter') { e.preventDefault(); if (!s.revealed) reveal(); else answer(3); return; }
  if (s.revealed && ['1', '2', '3', '4'].includes(k)) { if (s.preview && (k === '2' || k === '4')) return; e.preventDefault(); return answer(+k); }
  const lk = k.toLowerCase();
  if (lk === 'z') return undo();
  if (lk === 'e') return ACTIONS['edit-current']();
  if (lk === 'r') return ACTIONS.replay();
  if (lk === 'i') return cardInfo(s.card.id);
  if (lk === 'f') return flagMenu();
  if (k === '-') return cardAction('bury');
  if (k === '=') return cardAction('bury-note');
  if (k === '!') return cardAction('suspend');
});
$('#file-import').addEventListener('change', e => { importFiles([...e.target.files]); e.target.value = ''; });
$('#file-backup').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { const d = JSON.parse(await f.text()); if (d.retainBackup) confirmRestore(d); else showImportReport(importDeckData(d, f.name.replace(/\.[^.]+$/, '')), f.name); } catch (err) { toast('That file is not valid JSON'); } });
(function dragDrop() {
  const dz = $('#dropzone'); let depth = 0;
  const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
  addEventListener('dragenter', e => { if (!hasFiles(e)) return; depth++; dz.hidden = false; });
  addEventListener('dragleave', e => { if (!hasFiles(e)) return; if (--depth <= 0) { depth = 0; dz.hidden = true; } });
  addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); depth = 0; dz.hidden = true; if (e.target.closest?.('.occ-edit, input[type=file]')) return; importFiles([...e.dataTransfer.files]); });
})();
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['decks', 'add', 'browse', 'stats', 'settings'].includes(h) && h !== ui.view) go(h, false); });
document.addEventListener('visibilitychange', () => { if (document.hidden && col) save(true); });
addEventListener('pagehide', () => { if (col) save(true); });

/* =========================================================
   Boot
   ========================================================= */
(async function boot() {
  await Store.open();
  let stored = null; try { stored = await Store.get('col'); } catch (e) { }
  if (stored && stored.cards) { col = migrate(stored); rebuildIndex(); }
  else {
    col = newCollection(); rebuildIndex();
    if (SAMPLE_DECK) importDeckData(structuredClone(SAMPLE_DECK), 'Sample');
    save(true);
  }
  if (window.marked) marked.setOptions({ breaks: true, gfm: true });
  try { speechSynthesis.getVoices(); } catch (e) { }
  applyTheme();
  const h = location.hash.slice(1);
  go(['decks', 'add', 'browse', 'stats', 'settings'].includes(h) ? h : 'decks', false);
})();
</script>
