<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pandemic Turn & Phase Tracker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for medical/biohazard style icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased selection:bg-cyan-500 selection:text-slate-900">

  <!-- Top Navigation (Not Fixed) -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 shadow-md">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <a href="#" id="home-btn" class="flex items-center gap-2 text-cyan-400 hover:text-cyan-300 font-bold tracking-wide transition">
        <i class="fa-solid fa-biohazard text-xl animate-pulse"></i>
        <span>Pandemic Tracker</span>
      </a>
      <div class="flex items-center gap-2">
        <button id="undo-btn" class="p-2 rounded bg-slate-700 hover:bg-slate-600 disabled:opacity-40 disabled:hover:bg-slate-700 transition" title="Undo">
          <i class="fa-solid fa-arrow-rotate-left"></i>
        </button>
        <button id="redo-btn" class="p-2 rounded bg-slate-700 hover:bg-slate-600 disabled:opacity-40 disabled:hover:bg-slate-700 transition" title="Redo">
          <i class="fa-solid fa-arrow-rotate-right"></i>
        </button>
        <button id="reset-btn" class="ml-2 px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-sm font-semibold rounded shadow transition flex items-center gap-1">
          <i class="fa-solid fa-trash-can"></i> Reset
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 pb-24">
    
    <!-- Setup Screen -->
    <section id="setup-screen" class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-xl mt-4 space-y-5">
      <h2 class="text-xl font-bold text-cyan-400 flex items-center gap-2">
        <i class="fa-solid fa-sliders"></i> Match Configuration
      </h2>
      
      <div>
        <label for="max-days-input" class="block text-sm font-medium text-slate-300 mb-1">Target Turn Limit (Optional Safeguard):</label>
        <input type="number" id="max-days-input" value="20" min="1" max="50" class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-center text-xl text-cyan-400 font-bold focus:outline-none focus:border-cyan-500">
      </div>

      <!-- Layout Mode Selector -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">Display Mode:</label>
        <div class="grid grid-cols-2 gap-3">
          <label class="cursor-pointer">
            <input type="radio" name="ui-mode" value="normal" checked class="sr-only peer">
            <div class="p-3 text-center rounded-lg border border-slate-700 bg-slate-900/40 text-sm font-semibold text-slate-400 peer-checked:border-cyan-500 peer-checked:bg-cyan-500/10 peer-checked:text-cyan-400 transition">
              <i class="fa-solid fa-microscope block text-lg mb-1"></i> Normal Mode
              <span class="block text-xxs font-normal text-slate-500 mt-0.5">Show detailed action rules</span>
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="ui-mode" value="beginner" class="sr-only peer">
            <div class="p-3 text-center rounded-lg border border-slate-700 bg-slate-900/40 text-sm font-semibold text-slate-400 peer-checked:border-cyan-500 peer-checked:bg-cyan-500/10 peer-checked:text-cyan-400 transition">
              <i class="fa-solid fa-eye block text-lg mb-1"></i> Beginner Mode
              <span class="block text-xxs font-normal text-slate-500 mt-0.5">Just tell me the phase name</span>
            </div>
          </label>
        </div>
      </div>

      <button id="start-game-btn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold py-3 rounded-lg shadow-lg transition transform active:scale-[0.98]">
        Initialize Operations
      </button>
    </section>

    <!-- Main Tracker Screen -->
    <section id="tracker-screen" class="hidden space-y-4 mt-2">
      
      <!-- Day/Turn Status Bar -->
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow flex items-center justify-between sticky top-2 z-10 backdrop-blur-md bg-opacity-95">
        <div>
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 block">Current Rotation</span>
          <span class="text-2xl font-black text-cyan-400">Turn <span id="current-day-display">1</span><span class="text-slate-500 text-lg font-normal">/<span id="max-days-display">20</span></span></span>
        </div>
        <div class="text-right">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 block">Round Tracking</span>
          <span id="phase-progress-display" class="text-sm font-bold text-slate-300">Phase 1/3</span>
        </div>
      </div>

      <!-- Phase Container -->
      <div id="phase-container" class="space-y-4">
        <!-- Injected dynamically -->
      </div>

      <!-- Phase Navigation Footer Buttons -->
      <div class="flex justify-between items-center gap-4 pt-2">
        <button id="prev-phase-btn" class="flex-1 bg-slate-700 hover:bg-slate-600 disabled:opacity-40 disabled:hover:bg-slate-700 py-3 rounded-lg font-semibold transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-chevron-left"></i> Back
        </button>
        <button id="next-phase-btn" class="flex-1 bg-cyan-500 hover:bg-cyan-400 text-slate-900 py-3 rounded-lg font-bold transition flex items-center justify-center gap-2 shadow-lg">
          Next Step <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

    </section>

    <!-- Game Over Screen -->
    <section id="game-over-screen" class="hidden bg-slate-800 rounded-xl p-8 border border-slate-700 text-center shadow-xl mt-4 space-y-6">
      <div class="text-6xl text-rose-500 animate-bounce">
        <i class="fa-solid fa-skull-crossbones"></i>
      </div>
      <div>
        <h2 class="text-2xl font-extrabold text-slate-100">Operation Terminated</h2>
        <p class="text-slate-400 mt-2 text-sm">You have matched or exceeded your operational target limits for this session.</p>
      </div>
      <button id="restart-game-btn" class="px-6 py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold rounded-lg transition shadow-md">
        Deploy New Campaign
      </button>
    </section>

  </main>

  <script>
    // --- Pandemic Turn Phase Matrix ---
    const PHASES = [
      {
        name: "1. Do 4 Actions Phase",
        color: "border-l-4 border-cyan-500",
        bg: "bg-cyan-950/30",
        textTheme: "text-cyan-400",
        icon: "fa-user-doctor",
        notes: "Spend up to 4 actions total. You may mix, match, or pass actions completely.",
        rules: [
          { label: "Movement actions", detail: "Drive/Ferry (adjacent city), Flight (discard matching city card), Charter Flight (discard current city card to fly anywhere), Shuttle Flight (move between 2 Research Stations)." },
          { label: "Build Station", detail: "Discard card matching your current city to build a Research Station there." },
          { label: "Treat Disease", detail: "Remove 1 disease cube from your current city. (If this disease color is already cured, clear ALL cubes of that color with 1 action)." },
          { label: "Share Knowledge", detail: "Give/Take the card matching your current city to/from another player sharing your exact space." },
          { label: "Discover a Cure", detail: "At a Research Station, discard exactly 5 Player Cards of the same color to cure that strain." }
        ]
      },
      {
        name: "2. Draw 2 Cards Phase",
        color: "border-l-4 border-amber-500",
        bg: "bg-amber-950/30",
        textTheme: "text-amber-400",
        icon: "fa-layer-group",
        notes: "CRITICAL: Draw top 2 cards. Check for Epidemics immediately.",
        rules: [
          { label: "Draw Cards", detail: "Draw the top 2 cards from the Player Deck. If deck runs dry, players instantly lose!" },
          { label: "Epidemic Alert!", detail: "If an Epidemic card is drawn: 1. INCREASE rate marker. 2. INFECT bottom card city with 3 cubes. 3. INTENSIFY by shuffling infection discard pile back on top of deck." },
          { label: "Hand Limits", detail: "Check total hand card count. If hand sizes exceed exactly 7 cards, immediately discard down or play Event cards until you hit the 7 card limit." }
        ]
      },
      {
        name: "3. Infect Cities Phase",
        color: "border-l-4 border-rose-600",
        bg: "bg-rose-950/40",
        textTheme: "text-rose-400",
        icon: "fa-virus-covid",
        notes: "Flip cards matching the current visible Infection Rate track speed value.",
        rules: [
          { label: "Flip Targets", detail: "Draw cards from the Infection Deck equal to the current Infection Rate track value marker." },
          { label: "Distribute Cubes", detail: "Add exactly 1 disease cube of matching color to each flipped city card location." },
          { label: "Outbreak Trigger", detail: "If a city already has 3 cubes of that color and needs a 4th: do NOT add it. Advance Outbreak tracker +1 slot. Suffer chain reaction to all adjacent connected cities." },
          { label: "Pass Turn", detail: "Once all infection steps wrap up cleanly, hand operations over to the next player sitting to your left." }
        ]
      }
    ];

    let state = {
      currentDay: 1,
      maxDays: 20,
      currentPhaseIndex: 0,
      isPlaying: false,
      mode: "normal"
    };

    let undoStack = [];
    let redoStack = [];

    const setupScreen = document.getElementById('setup-screen');
    const trackerScreen = document.getElementById('tracker-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const maxDaysInput = document.getElementById('max-days-input');
    const startGameBtn = document.getElementById('start-game-btn');
    const restartGameBtn = document.getElementById('restart-game-btn');
    
    const currentDayDisplay = document.getElementById('current-day-display');
    const maxDaysDisplay = document.getElementById('max-days-display');
    const phaseProgressDisplay = document.getElementById('phase-progress-display');
    const phaseContainer = document.getElementById('phase-container');
    
    const prevPhaseBtn = document.getElementById('prev-phase-btn');
    const nextPhaseBtn = document.getElementById('next-phase-btn');
    const undoBtn = document.getElementById('undo-btn');
    const redoBtn = document.getElementById('redo-btn');
    const resetBtn = document.getElementById('reset-btn');
    const homeBtn = document.getElementById('home-btn');

    function init() {
      const savedState = localStorage.getItem('pan_tracker_state');
      if (savedState) {
        try {
          state = JSON.parse(savedState);
          maxDaysInput.value = state.maxDays;
          const checkedRadio = document.querySelector(`input[name="ui-mode"][value="${state.mode}"]`);
          if (checkedRadio) checkedRadio.checked = true;
        } catch(e) {
          resetToDefault();
        }
      }
      undoStack = [];
      redoStack = [];
      render();
    }

    function saveToLocalStorage() {
      localStorage.setItem('pan_tracker_state', JSON.stringify(state));
    }

    function pushToHistory() {
      undoStack.push(JSON.stringify(state));
      redoStack = [];
      updateHistoryButtons();
    }

    function updateHistoryButtons() {
      undoBtn.disabled = undoStack.length === 0;
      redoBtn.disabled = redoStack.length === 0;
    }

    function resetToDefault() {
      const selectedMode = document.querySelector('input[name="ui-mode"]:checked').value;
      state = {
        currentDay: 1,
        maxDays: parseInt(maxDaysInput.value, 10) || 20,
        currentPhaseIndex: 0,
        isPlaying: false,
        mode: selectedMode
      };
      undoStack = [];
      redoStack = [];
      saveToLocalStorage();
    }

    function render() {
      updateHistoryButtons();

      if (!state.isPlaying) {
        setupScreen.classList.remove('hidden');
        trackerScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        return;
      }

      if (state.currentDay > state.maxDays) {
        setupScreen.classList.add('hidden');
        trackerScreen.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
        return;
      }

      setupScreen.classList.add('hidden');
      trackerScreen.classList.remove('hidden');
      gameOverScreen.classList.add('hidden');

      currentDayDisplay.textContent = state.currentDay;
      maxDaysDisplay.textContent = state.maxDays;
      phaseProgressDisplay.textContent = `Phase ${state.currentPhaseIndex + 1}/${PHASES.length}`;

      const phase = PHASES[state.currentPhaseIndex];
      
      if (state.mode === 'beginner') {
        phaseContainer.innerHTML = `
          <div class="bg-slate-800 rounded-xl shadow-xl overflow-hidden border border-slate-700 text-center py-12 px-6 transition duration-300 ${phase.color}">
            <div class="w-16 h-16 rounded-full bg-slate-900/80 flex items-center justify-center ${phase.textTheme} mx-auto mb-4 border border-slate-700 shadow-inner">
              <i class="fa-solid ${phase.icon} text-2xl"></i>
            </div>
            <h2 class="text-2xl font-black tracking-wide text-slate-100">${phase.name}</h2>
            <p class="text-sm text-slate-400 mt-3 max-w-sm mx-auto font-medium italic">${phase.notes}</p>
          </div>
        `;
      } else {
        let rulesHTML = phase.rules.map(rule => `
          <div class="py-2.5 border-b border-slate-700/60 last:border-none flex flex-col sm:flex-row sm:items-baseline gap-1 sm:gap-4">
            <span class="font-bold text-slate-200 text-sm sm:w-1/4 shrink-0 flex items-center gap-1.5">
              <i class="fa-solid fa-square-poll-horizontal ${phase.textTheme} text-xs"></i> ${rule.label}
            </span>
            <span class="text-slate-300 text-sm leading-relaxed sm:w-3/4">${rule.detail}</span>
          </div>
        `).join('');

        phaseContainer.innerHTML = `
          <div class="bg-slate-800 rounded-xl shadow-xl overflow-hidden border border-slate-700 transition duration-300 ${phase.color}">
            <div class="p-4 ${phase.bg} border-b border-slate-700/50 flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-slate-900/60 flex items-center justify-center ${phase.textTheme}">
                <i class="fa-solid ${phase.icon} text-lg"></i>
              </div>
              <div>
                <h2 class="text-lg font-black tracking-wide text-slate-100">${phase.name}</h2>
                <p class="text-xs ${phase.textTheme} opacity-90 font-medium italic mt-0.5">${phase.notes}</p>
              </div>
            </div>
            <div class="p-4 divide-y divide-slate-700/40 bg-slate-800/40">
              ${rulesHTML}
            </div>
          </div>
        `;
      }

      prevPhaseBtn.disabled = (state.currentDay === 1 && state.currentPhaseIndex === 0);
      
      if (state.currentPhaseIndex === PHASES.length - 1) {
        nextPhaseBtn.innerHTML = `End Turn <i class="fa-solid fa-shield-virus ml-1"></i>`;
        nextPhaseBtn.classList.replace('bg-cyan-500', 'bg-emerald-600');
        nextPhaseBtn.classList.replace('hover:bg-cyan-400', 'hover:bg-emerald-500');
        nextPhaseBtn.classList.replace('text-slate-900', 'text-white');
      } else {
        nextPhaseBtn.innerHTML = `Next Step <i class="fa-solid fa-chevron-right ml-1"></i>`;
        nextPhaseBtn.classList.replace('bg-emerald-600', 'bg-cyan-500');
        nextPhaseBtn.classList.replace('hover:bg-emerald-500', 'hover:bg-cyan-400');
        nextPhaseBtn.classList.replace('text-white', 'text-slate-900');
      }
    }

    startGameBtn.addEventListener('click', () => {
      pushToHistory();
      const selectedMode = document.querySelector('input[name="ui-mode"]:checked').value;
      state.maxDays = parseInt(maxDaysInput.value, 10) || 20;
      state.currentDay = 1;
      state.currentPhaseIndex = 0;
      state.mode = selectedMode;
      state.isPlaying = true;
      saveToLocalStorage();
      render();
    });

    nextPhaseBtn.addEventListener('click', () => {
      pushToHistory();
      if (state.currentPhaseIndex < PHASES.length - 1) {
        state.currentPhaseIndex++;
      } else {
        state.currentDay++;
        state.currentPhaseIndex = 0;
      }
      saveToLocalStorage();
      render();
    });

    prevPhaseBtn.addEventListener('click', () => {
      pushToHistory();
      if (state.currentPhaseIndex > 0) {
        state.currentPhaseIndex--;
      } else if (state.currentDay > 1) {
        state.currentDay--;
        state.currentPhaseIndex = PHASES.length - 1;
      }
      saveToLocalStorage();
      render();
    });

    undoBtn.addEventListener('click', () => {
      if (undoStack.length > 0) {
        redoStack.push(JSON.stringify(state));
        state = JSON.parse(undoStack.pop());
        saveToLocalStorage();
        render();
      }
    });

    redoBtn.addEventListener('click', () => {
      if (redoStack.length > 0) {
        undoStack.push(JSON.stringify(state));
        state = JSON.parse(redoStack.pop());
        saveToLocalStorage();
        render();
      }
    });

    resetBtn.addEventListener('click', () => {
      if(confirm("Reset deployment data? Active quarantine session progress will be wiped.")) {
        resetToDefault();
        render();
      }
    });

    restartGameBtn.addEventListener('click', () => {
      resetToDefault();
      render();
    });

    homeBtn.addEventListener('click', (e) => {
      e.preventDefault();
      pushToHistory();
      state.isPlaying = false;
      saveToLocalStorage();
      render();
    });

    init();
  </script>
</body>
</html>
