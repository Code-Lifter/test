<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatigue-Adjusted INOL Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-gray-900 rounded-3xl shadow-2xl border border-gray-800 overflow-hidden">
        <div class="bg-gradient-to-r from-red-600 to-orange-600 p-6">
            <h1 class="text-2xl font-black uppercase tracking-tighter italic">Fatigue-Adjusted INOL</h1>
            <p class="text-red-100 text-xs opacity-80">Autoregulated Volume & Intensity Tracking</p>
        </div>

        <div class="p-6 space-y-6">
            <!-- Global 1RM -->
            <div class="flex flex-col md:flex-row md:items-center gap-4 bg-gray-800/50 p-4 rounded-xl">
                <div class="flex-1">
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Target Exercise 1-Rep Max</label>
                    <input type="number" id="oneRm" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-xl font-bold focus:ring-2 focus:ring-orange-500 outline-none" placeholder="e.g. 140">
                </div>
                <div class="text-xs text-gray-500 max-w-xs italic">
                    "The math fails if this number is an ego-lift. Use your real, clean-form max."
                </div>
            </div>

            <!-- Headers for Desktop -->
            <div class="hidden md:grid grid-cols-12 gap-4 px-2 text-[10px] font-bold text-gray-500 uppercase">
                <div class="col-span-2">Weight</div>
                <div class="col-span-2">Reps</div>
                <div class="col-span-3">Rest Taken</div>
                <div class="col-span-3">Feeling (RPE)</div>
                <div class="col-span-2 text-right">Action</div>
            </div>

            <div id="sets-container" class="space-y-4">
                <!-- Dynamic Rows Go Here -->
            </div>

            <div class="flex flex-wrap gap-3 pt-4 border-t border-gray-800">
                <button onclick="addSetRow()" class="px-6 py-3 bg-gray-800 hover:bg-gray-700 rounded-xl font-bold text-sm transition">+ Add Set</button>
                <button onclick="calculateFinal()" class="flex-1 px-6 py-3 bg-orange-600 hover:bg-orange-500 rounded-xl font-bold text-sm shadow-lg shadow-orange-900/40 transition">Calculate Fatigue Score</button>
            </div>

            <!-- Result Panel -->
            <div id="result-panel" class="hidden mt-8 p-6 bg-black rounded-2xl border-l-4 border-orange-600">
                <div class="flex justify-between items-center">
                    <div>
                        <span class="text-[10px] font-bold text-gray-500 uppercase">Total Fatigue Score (Adjusted INOL)</span>
                        <div id="totalVal" class="text-7xl font-black">0.00</div>
                    </div>
                    <div id="rating" class="text-right">
                        <div id="status-text" class="text-2xl font-bold text-orange-500">READY</div>
                        <div id="status-desc" class="text-xs text-gray-400 mt-1 max-w-[200px]">Enter sets to begin analysis.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function addSetRow() {
            const container = document.getElementById('sets-container');
            const div = document.createElement('div');
            div.className = "set-row grid grid-cols-1 md:grid-cols-12 gap-4 items-end bg-gray-800/30 p-4 rounded-xl border border-gray-800/50";
            div.innerHTML = `
                <div class="col-span-2">
                    <label class="md:hidden text-[10px] text-gray-500">WEIGHT</label>
                    <input type="number" class="w-full bg-gray-900 border border-gray-700 rounded p-2 set-weight" placeholder="Weight">
                </div>
                <div class="col-span-2">
                    <label class="md:hidden text-[10px] text-gray-500">REPS</label>
                    <input type="number" class="w-full bg-gray-900 border border-gray-700 rounded p-2 set-reps" placeholder="Reps">
                </div>
                <div class="col-span-3">
                    <label class="md:hidden text-[10px] text-gray-500">REST</label>
                    <select class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm set-rest">
                        <option value="1.0">> 3 Mins (Full)</option>
                        <option value="1.15">1-2 Mins (Medium)</option>
                        <option value="1.25">< 60 Secs (Short)</option>
                    </select>
                </div>
                <div class="col-span-3">
                    <label class="md:hidden text-[10px] text-gray-500">FEELING</label>
                    <select class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm set-rpe">
                        <option value="1.0">RPE 7-8 (Moved Well)</option>
                        <option value="1.1">RPE 9 (Grinder)</option>
                        <option value="1.25">RPE 10 (Max Effort)</option>
                    </select>
                </div>
                <div class="col-span-2 text-right">
                    <button onclick="this.closest('.set-row').remove()" class="text-gray-600 hover:text-red-500">Remove</button>
                </div>
            `;
            container.appendChild(div);
        }

        function calculateFinal() {
            const oneRm = parseFloat(document.getElementById('oneRm').value);
            if (!oneRm) { alert("Enter your 1RM first."); return; }

            let totalAdjustedInol = 0;
            const rows = document.querySelectorAll('.set-row');

            rows.forEach(row => {
                const w = parseFloat(row.querySelector('.set-weight').value);
                const r = parseFloat(row.querySelector('.set-reps').value);
                const mRest = parseFloat(row.querySelector('.set-rest').value);
                const mRpe = parseFloat(row.querySelector('.set-rpe').value);

                if (w && r) {
                    const intensity = (w / oneRm) * 100;
                    const baseInol = r / (100 - intensity);
                    totalAdjustedInol += (baseInol * mRest * mRpe);
                }
            });

            document.getElementById('result-panel').classList.remove('hidden');
            document.getElementById('totalVal').innerText = totalAdjustedInol.toFixed(2);

            const status = document.getElementById('status-text');
            const desc = document.getElementById('status-desc');

            if (totalAdjustedInol <= 1.0) {
                status.innerText = "OPTIMAL";
                status.className = "text-2xl font-bold text-emerald-500";
                desc.innerText = "Perfect balance. You are stimulating growth without over-reaching.";
            } else if (totalAdjustedInol <= 1.5) {
                status.innerText = "HEAVY TAX";
                status.className = "text-2xl font-bold text-orange-500";
                desc.innerText = "Significant systemic fatigue. You'll need extra recovery time.";
            } else {
                status.innerText = "REDLINE";
                status.className = "text-2xl font-bold text-red-500";
                desc.innerText = "Overtraining risk. If you keep this up, you'll regress or snap.";
            }
        }

        // Initialize with one row
        addSetRow();
    </script>
</body>
</html>
