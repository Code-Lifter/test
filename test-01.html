<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drop Set & 1RM Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 font-sans antialiased">

  <!-- Calculator Card -->
  <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 w-full max-w-md shadow-2xl">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold text-white mb-2">Drop Set Calculator</h2>
      <p class="text-slate-400 text-sm">Calculate your 1RM and target weights for a 20% drop set progression.</p>
    </div>

    <!-- Inputs -->
    <div class="space-y-4 mb-6">
      <div>
        <label for="weightInput" class="block text-sm font-medium text-slate-300 mb-1">Weight Lifted (kg/lbs)</label>
        <input type="number" id="weightInput" placeholder="e.g. 100" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
      </div>
      <div>
        <label for="repsInput" class="block text-sm font-medium text-slate-300 mb-1">Reps Completed</label>
        <input type="number" id="repsInput" placeholder="e.g. 5" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
      </div>
    </div>

    <!-- Calculate Button -->
    <button id="calcBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-lg shadow-lg shadow-indigo-600/30 transition-all active:scale-[0.98] mb-8">
      Calculate Targets
    </button>

    <!-- Results Section -->
    <div id="resultsArea" class="hidden space-y-4 border-t border-slate-700 pt-6">
      
      <!-- 1RM Highlight -->
      <div class="bg-indigo-900/30 border border-indigo-500/30 rounded-xl p-4 text-center">
        <span class="block text-indigo-300 text-xs uppercase tracking-wider font-semibold mb-1">Estimated 1RM</span>
        <span id="oneRepMaxOutput" class="text-3xl font-bold text-white">0</span>
      </div>

      <!-- Drop Sets List -->
      <div class="space-y-3">
        <div class="flex justify-between items-center bg-slate-900 rounded-lg p-3 border border-slate-700">
          <span class="text-slate-300 text-sm font-medium">Working Set (Initial)</span>
          <span id="initialWeightOut" class="text-white font-bold">0</span>
        </div>
        <div class="flex justify-between items-center bg-slate-900 rounded-lg p-3 border border-slate-700">
          <span class="text-slate-300 text-sm font-medium">Drop 1 (-20%)</span>
          <span id="dropOneOut" class="text-yellow-400 font-bold">0</span>
        </div>
        <div class="flex justify-between items-center bg-slate-900 rounded-lg p-3 border border-slate-700">
          <span class="text-slate-300 text-sm font-medium">Drop 2 (-20% again)</span>
          <span id="dropTwoOut" class="text-red-400 font-bold">0</span>
        </div>
      </div>

    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    document.getElementById('calcBtn').addEventListener('click', () => {
      const weight = parseFloat(document.getElementById('weightInput').value);
      const reps = parseInt(document.getElementById('repsInput').value);

      // Validation
      if (isNaN(weight) || isNaN(reps) || weight <= 0 || reps <= 0) {
        alert("Please enter valid positive numbers for weight and reps.");
        return;
      }

      // 1RM Calculation using Epley Formula: Weight * (1 + (Reps / 30))
      const oneRepMax = weight * (1 + (reps / 30));
      
      // Drop Set Calculations (20% reductions as per standard protocols)
      const dropOne = weight * 0.80; // 20% off initial working weight
      const dropTwo = dropOne * 0.80; // 20% off the first drop weight

      // Update UI Elements
      document.getElementById('oneRepMaxOutput').innerText = oneRepMax.toFixed(1);
      document.getElementById('initialWeightOut').innerText = weight.toFixed(1);
      document.getElementById('dropOneOut').innerText = dropOne.toFixed(1);
      document.getElementById('dropTwoOut').innerText = dropTwo.toFixed(1);

      // Reveal Results Area
      document.getElementById('resultsArea').classList.remove('hidden');
    });
  </script>

</body>
</html>
