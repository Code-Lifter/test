<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Ping Pong Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center font-sans">
  
  <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center border border-slate-700">
    <h1 class="text-3xl font-extrabold mb-8 text-emerald-400 tracking-tight">Match Tracker</h1>

    <div class="flex justify-between items-center mb-8 gap-6">
      
      <div class="flex-1 bg-slate-700/50 p-4 rounded-xl border border-slate-600">
        <h2 class="text-lg font-semibold mb-2 text-slate-300">Player 1 
          <div id="serve1" class="text-yellow-400 text-xs font-bold uppercase mt-1 tracking-wider">🏓 Serving</div>
        </h2>
        <div id="score1" class="text-7xl font-black mb-6 tabular-nums">0</div>
        <button onclick="addPoint(1)" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-900 py-3 rounded-lg font-bold transition-all active:scale-95 disabled:opacity-50 disabled:active:scale-100" id="btn1">+1 Point</button>
      </div>

      <div class="text-3xl font-black text-slate-600 pb-12">VS</div>

      <div class="flex-1 bg-slate-700/50 p-4 rounded-xl border border-slate-600">
        <h2 class="text-lg font-semibold mb-2 text-slate-300">Player 2 
          <div id="serve2" class="text-yellow-400 text-xs font-bold uppercase mt-1 tracking-wider invisible">🏓 Serving</div>
        </h2>
        <div id="score2" class="text-7xl font-black mb-6 tabular-nums">0</div>
        <button onclick="addPoint(2)" class="w-full bg-blue-500 hover:bg-blue-400 text-slate-900 py-3 rounded-lg font-bold transition-all active:scale-95 disabled:opacity-50 disabled:active:scale-100" id="btn2">+1 Point</button>
      </div>
    </div>

    <div id="status" class="text-xl font-bold text-slate-400 mb-8 h-8 flex items-center justify-center bg-slate-900 rounded-lg">First to 11 (Win by 2)</div>

    <button onclick="resetGame()" class="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/50 py-3 rounded-lg font-bold transition-colors">Reset Match</button>
  </div>

  <script>
    let p1Score = 0;
    let p2Score = 0;
    let isGameOver = false;
    const WINNING_SCORE = 11;

    const updateUI = () => {
      document.getElementById('score1').textContent = p1Score;
      document.getElementById('score2').textContent = p2Score;

      // The real logic: Serve tracking
      const totalPoints = p1Score + p2Score;
      let p1Serves = true;

      if (p1Score >= 10 && p2Score >= 10) {
        // Deuce rule: Serve alternates every single point
        p1Serves = (totalPoints % 2 === 0);
        if (!isGameOver) document.getElementById('status').textContent = 'Deuce! Alternate serves.';
      } else {
        // Standard rule: Serve alternates every 2 points
        p1Serves = Math.floor(totalPoints / 2) % 2 === 0;
      }

      if (!isGameOver) {
        document.getElementById('serve1').classList.toggle('invisible', !p1Serves);
        document.getElementById('serve2').classList.toggle('invisible', p1Serves);
      } else {
        document.getElementById('serve1').classList.add('invisible');
        document.getElementById('serve2').classList.add('invisible');
      }
    };

    const addPoint = (player) => {
      if (isGameOver) return;
      player === 1 ? p1Score++ : p2Score++;
      checkWin();
      updateUI();
    };

    const checkWin = () => {
      // The win condition: Reached 11 AND leading by at least 2
      if ((p1Score >= WINNING_SCORE || p2Score >= WINNING_SCORE) && Math.abs(p1Score - p2Score) >= 2) {
        isGameOver = true;
        const winner = p1Score > p2Score ? 'Player 1' : 'Player 2';
        
        const statusEl = document.getElementById('status');
        statusEl.textContent = `🏆 ${winner} Takes the Match!`;
        statusEl.classList.replace('text-slate-400', 'text-yellow-400');
        
        document.getElementById('btn1').disabled = true;
        document.getElementById('btn2').disabled = true;
      }
    };

    const resetGame = () => {
      p1Score = 0;
      p2Score = 0;
      isGameOver = false;
      
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'First to 11 (Win by 2)';
      statusEl.classList.replace('text-yellow-400', 'text-slate-400');
      
      document.getElementById('btn1').disabled = false;
      document.getElementById('btn2').disabled = false;
      
      updateUI();
    };
  </script>
</body>
</html>
