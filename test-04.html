<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Protocol Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Hide default radio buttons */
        input[type="radio"] {
            display: none;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen p-6 md:p-12">

    <div class="max-w-3xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-white tracking-tight mb-2">The Protocol Generator</h1>
            <p class="text-slate-400">No math. No calculators. Just clear marching orders.</p>
        </header>

        <form id="protocolForm" class="space-y-8 bg-slate-800 p-8 rounded-2xl shadow-xl">
            
            <div>
                <h2 class="text-xl font-bold mb-4 text-white">1. What is the primary mission?</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <label class="cursor-pointer">
                        <input type="radio" name="goal" value="size" checked>
                        <div class="card bg-slate-700 hover:bg-slate-600 rounded-lg p-4 text-center transition-colors border-2 border-transparent peer-checked:border-blue-500 peer-checked:bg-blue-900/30">
                            <h3 class="font-bold text-lg">Get Bigger</h3>
                            <p class="text-sm text-slate-400">Focus on muscle size</p>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="goal" value="power" class="peer">
                        <div class="card bg-slate-700 hover:bg-slate-600 rounded-lg p-4 text-center transition-colors border-2 border-transparent peer-checked:border-blue-500 peer-checked:bg-blue-900/30">
                            <h3 class="font-bold text-lg">Get Stronger</h3>
                            <p class="text-sm text-slate-400">Focus on raw power</p>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="goal" value="shred" class="peer">
                        <div class="card bg-slate-700 hover:bg-slate-600 rounded-lg p-4 text-center transition-colors border-2 border-transparent peer-checked:border-blue-500 peer-checked:bg-blue-900/30">
                            <h3 class="font-bold text-lg">Lean Out</h3>
                            <p class="text-sm text-slate-400">Strip body fat</p>
                        </div>
                    </label>
                </div>
            </div>

            <div>
                <h2 class="text-xl font-bold mb-4 text-white">2. What is your experience level?</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <label class="cursor-pointer">
                        <input type="radio" name="experience" value="beginner" checked class="peer">
                        <div class="card bg-slate-700 hover:bg-slate-600 rounded-lg p-4 text-center transition-colors border-2 border-transparent peer-checked:border-blue-500 peer-checked:bg-blue-900/30">
                            <h3 class="font-bold text-lg">Fresh Start</h3>
                            <p class="text-sm text-slate-400">New to lifting</p>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="experience" value="experienced" class="peer">
                        <div class="card bg-slate-700 hover:bg-slate-600 rounded-lg p-4 text-center transition-colors border-2 border-transparent peer-checked:border-blue-500 peer-checked:bg-blue-900/30">
                            <h3 class="font-bold text-lg">Experienced</h3>
                            <p class="text-sm text-slate-400">I know my way around</p>
                        </div>
                    </label>
                </div>
            </div>

            <div>
                <h2 class="text-xl font-bold mb-4 text-white">3. What is your hardware status?</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <label class="cursor-pointer">
                        <input type="radio" name="age" value="under40" checked class="peer">
                        <div class="card bg-slate-700 hover:bg-slate-600 rounded-lg p-4 text-center transition-colors border-2 border-transparent peer-checked:border-blue-500 peer-checked:bg-blue-900/30">
                            <h3 class="font-bold text-lg">Under 40</h3>
                            <p class="text-sm text-slate-400">Young & Durable</p>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="age" value="over40" class="peer">
                        <div class="card bg-slate-700 hover:bg-slate-600 rounded-lg p-4 text-center transition-colors border-2 border-transparent peer-checked:border-blue-500 peer-checked:bg-blue-900/30">
                            <h3 class="font-bold text-lg">Over 40</h3>
                            <p class="text-sm text-slate-400">Smart & Recovering</p>
                        </div>
                    </label>
                </div>
            </div>

            <button type="button" onclick="generatePlan()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-8 rounded-lg shadow-lg transition-all transform hover:scale-[1.02]">
                Generate My Protocol
            </button>
        </form>

        <div id="resultContainer" class="hidden mt-10 space-y-6">
            <h2 class="text-3xl font-bold text-white border-b border-slate-700 pb-4">Your Custom Protocol</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
                    <div class="text-blue-400 text-sm font-bold uppercase tracking-wider mb-1">The Kitchen</div>
                    <h3 id="dietTitle" class="text-2xl font-bold text-white mb-3"></h3>
                    <p id="dietText" class="text-slate-300 leading-relaxed"></p>
                </div>

                <div class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
                    <div class="text-emerald-400 text-sm font-bold uppercase tracking-wider mb-1">The Floor</div>
                    <h3 id="workoutTitle" class="text-2xl font-bold text-white mb-3"></h3>
                    <p id="workoutText" class="text-slate-300 leading-relaxed"></p>
                    <p id="expNote" class="text-sm text-emerald-300 mt-4 italic font-semibold"></p>
                </div>

                <div class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
                    <div class="text-rose-400 text-sm font-bold uppercase tracking-wider mb-1">The Engine</div>
                    <h3 id="cardioTitle" class="text-2xl font-bold text-white mb-3"></h3>
                    <p id="cardioText" class="text-slate-300 leading-relaxed"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Update styling logic for active radio buttons
        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', function() {
                // Clear all borders in the current group
                const groupName = this.name;
                document.querySelectorAll(`input[name="${groupName}"]`).forEach(input => {
                    const card = input.nextElementSibling;
                    card.classList.remove('border-blue-500', 'bg-blue-900/30');
                    card.classList.add('border-transparent', 'bg-slate-700');
                });
                // Add border to selected
                const selectedCard = this.nextElementSibling;
                selectedCard.classList.remove('border-transparent', 'bg-slate-700');
                selectedCard.classList.add('border-blue-500', 'bg-blue-900/30');
            });
        });

        function generatePlan() {
            // 1. Capture Inputs
            const goal = document.querySelector('input[name="goal"]:checked').value;
            const exp = document.querySelector('input[name="experience"]:checked').value;
            const age = document.querySelector('input[name="age"]:checked').value;

            // 2. Initialize Output Objects
            let diet = { title: "", text: "" };
            let workout = { title: "", text: "" };
            let cardio = { title: "", text: "" };
            let experienceNote = "";

            // --- THE DIRECTIVE LOGIC MATRIX ---

            // Diet Logic
            if (goal === "size" || goal === "power") {
                diet.title = "The Bulk";
                diet.text = "Eat more than you usually do. Add an extra meal or a shake every day. If the scale isn't moving up after two weeks, eat more.";
            } else if (goal === "shred") {
                diet.title = "The Cut";
                diet.text = "Eat less than you usually do. Cut out the liquid calories, reduce your carbs at dinner, and stop snacking. If you aren't looking tighter in two weeks, trim a bit more.";
            }

            // Workout Logic (Age acts as the ultimate guardrail here)
            if (age === "over40") {
                workout.title = "The 3x12 (Joint-Saver)";
                workout.text = "Skip the heavy free-weight barbells. Use machines and cables for 3 sets of 12 reps to keep constant tension on the muscle while completely protecting your lower back and joints.";
            } else {
                if (goal === "power") {
                    workout.title = "The 5x5 (Heavy Compound)";
                    workout.text = "Pick 3 big compound movements per workout (Squat, Bench, Deadlift). Do 5 sets of 5 reps. Rest 3-5 minutes between sets. Add weight to the bar every single time you gym.";
                } else {
                    workout.title = "The 3x10 (The Pump)";
                    workout.text = "Pick 4-5 exercises. Hit 3 sets of 10 reps focusing entirely on squeezing the muscle and chasing the pump. Keep your rest periods to 60-90 seconds.";
                }
            }

            // Experience Modifier Note
            if (exp === "beginner") {
                experienceNote = "Rule #1: Master the form with light weight before you ever try to push heavy. Don't ego lift.";
            } else {
                experienceNote = "Since you know your way around, push these working sets to 1-2 reps shy of absolute failure.";
            }

            // Cardio Logic
            if (goal === "power") {
                cardio.title = "The Skip It";
                cardio.text = "Do zero dedicated cardio. Conserve every ounce of energy for moving heavy weight and recovering your nervous system.";
            } else if (goal === "size" || age === "over40") {
                cardio.title = "The LISS (Low-Impact)";
                cardio.text = "Go for a 30-minute brisk walk or incline treadmill session on your rest days. Keeps the heart healthy without draining your recovery or burning muscle fuel.";
            } else if (goal === "shred" && age === "under40") {
                cardio.title = "The HIIT (High Intensity)";
                cardio.text = "Do 15 minutes of hard intervals (sprints, rowing, or stationary bike) at the very end of your workout. Burn it out.";
            }

            // 3. Inject into the DOM
            document.getElementById('dietTitle').innerText = diet.title;
            document.getElementById('dietText').innerText = diet.text;

            document.getElementById('workoutTitle').innerText = workout.title;
            document.getElementById('workoutText').innerText = workout.text;
            document.getElementById('expNote').innerText = experienceNote;

            document.getElementById('cardioTitle').innerText = cardio.title;
            document.getElementById('cardioText').innerText = cardio.text;

            // Reveal the Output Section smoothly
            const resultDiv = document.getElementById('resultContainer');
            resultDiv.classList.remove('hidden');
            resultDiv.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
