<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Protocol Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="radio"] { display: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen p-6 md:p-12">

    <div class="max-w-4xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-white tracking-tight mb-2">The Protocol Generator</h1>
            <p class="text-slate-400">No math. No calculators. Just clear marching orders.</p>
        </header>

        <form id="protocolForm" class="space-y-8 bg-slate-800 p-8 rounded-2xl shadow-xl">
            
            <div>
                <h2 class="text-xl font-bold mb-4 text-white">1. What is the primary mission?</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <label class="cursor-pointer">
                        <input type="radio" name="goal" value="size" checked>
                        <div class="card bg-slate-700 hover:bg-slate-600 rounded-lg p-4 text-center transition-colors border-2 border-blue-500 bg-blue-900/30">
                            <h3 class="font-bold text-lg">Get Bigger</h3>
                            <p class="text-sm text-slate-400">Focus on muscle size</p>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="goal" value="power">
                        <div class="card bg-slate-700 hover:bg-slate-600 rounded-lg p-4 text-center transition-colors border-2 border-transparent">
                            <h3 class="font-bold text-lg">Get Stronger</h3>
                            <p class="text-sm text-slate-400">Focus on raw power</p>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="goal" value="shred">
                        <div class="card bg-slate-700 hover:bg-slate-600 rounded-lg p-4 text-center transition-colors border-2 border-transparent">
                            <h3 class="font-bold text-lg">Lean Out</h3>
                            <p class="text-sm text-slate-400">Strip body fat</p>
                        </div>
                    </label>
                </div>
            </div>

            <div>
                <h2 class="text-xl font-bold mb-4 text-white">2. What is your experience level?</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <label class="cursor-pointer">
                        <input type="radio" name="experience" value="beginner" checked>
                        <div class="card bg-slate-700 hover:bg-slate-600 rounded-lg p-4 text-center transition-colors border-2 border-blue-500 bg-blue-900/30">
                            <h3 class="font-bold text-lg">Fresh Start</h3>
                            <p class="text-sm text-slate-400">New to lifting</p>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="experience" value="experienced">
                        <div class="card bg-slate-700 hover:bg-slate-600 rounded-lg p-4 text-center transition-colors border-2 border-transparent">
                            <h3 class="font-bold text-lg">Experienced</h3>
                            <p class="text-sm text-slate-400">I know my way around</p>
                        </div>
                    </label>
                </div>
            </div>

            <div>
                <h2 class="text-xl font-bold mb-4 text-white">3. What is your hardware status?</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <label class="cursor-pointer">
                        <input type="radio" name="age" value="under40" checked>
                        <div class="card bg-slate-700 hover:bg-slate-600 rounded-lg p-4 text-center transition-colors border-2 border-blue-500 bg-blue-900/30">
                            <h3 class="font-bold text-lg">Under 40</h3>
                            <p class="text-sm text-slate-400">Young & Durable</p>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="age" value="over40">
                        <div class="card bg-slate-700 hover:bg-slate-600 rounded-lg p-4 text-center transition-colors border-2 border-transparent">
                            <h3 class="font-bold text-lg">Over 40</h3>
                            <p class="text-sm text-slate-400">Smart & Recovering</p>
                        </div>
                    </label>
                </div>
            </div>

            <button type="button" onclick="generatePlan()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-8 rounded-lg shadow-lg transition-all transform hover:scale-[1.01]">
                Deploy My Protocol
            </button>
        </form>

        <div id="resultContainer" class="hidden mt-10 space-y-6">
            <h2 class="text-3xl font-bold text-white border-b border-slate-700 pb-4">Your Custom Protocol</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <div class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
                    <div class="text-blue-400 text-sm font-bold uppercase tracking-wider mb-1">The Kitchen</div>
                    <h3 id="dietTitle" class="text-xl font-bold text-white mb-3"></h3>
                    <p id="dietText" class="text-slate-300 text-sm leading-relaxed"></p>
                </div>

                <div class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
                    <div class="text-emerald-400 text-sm font-bold uppercase tracking-wider mb-1">The Floor</div>
                    <h3 id="workoutTitle" class="text-xl font-bold text-white mb-3"></h3>
                    <p id="workoutText" class="text-slate-300 text-sm leading-relaxed"></p>
                    <p id="expNote" class="text-xs text-emerald-300 mt-4 italic font-semibold"></p>
                </div>

                <div class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
                    <div class="text-rose-400 text-sm font-bold uppercase tracking-wider mb-1">The Engine</div>
                    <h3 id="cardioTitle" class="text-xl font-bold text-white mb-3"></h3>
                    <p id="cardioText" class="text-slate-300 text-sm leading-relaxed"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
                    <div class="text-purple-400 text-sm font-bold uppercase tracking-wider mb-1">The Armor</div>
                    <h3 id="recoveryTitle" class="text-xl font-bold text-white mb-3"></h3>
                    <p id="recoveryText" class="text-slate-300 text-sm leading-relaxed"></p>
                </div>

                <div class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
                    <div class="text-amber-400 text-sm font-bold uppercase tracking-wider mb-1">Daily Anchor</div>
                    <h3 id="anchorTitle" class="text-xl font-bold text-white mb-3"></h3>
                    <p id="anchorText" class="text-slate-300 text-sm leading-relaxed"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // UI Logic for Radio Buttons
        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const groupName = this.name;
                document.querySelectorAll(`input[name="${groupName}"]`).forEach(input => {
                    const card = input.nextElementSibling;
                    card.classList.remove('border-blue-500', 'bg-blue-900/30');
                    card.classList.add('border-transparent');
                });
                const selectedCard = this.nextElementSibling;
                selectedCard.classList.remove('border-transparent');
                selectedCard.classList.add('border-blue-500', 'bg-blue-900/30');
            });
        });

        // --- MODULAR LOGIC ENGINE ---

        const buildDiet = (state) => {
            if (state.goal === "shred") {
                return { title: "The Cut", text: "Eat less than you usually do. Cut out liquid calories, reduce carbs at dinner, and stop snacking. If you aren't looking tighter in two weeks, trim a bit more." };
            }
            return { title: "The Bulk", text: "Eat more than you usually do. Add an extra meal or a shake every day. If the scale isn't moving up after two weeks, eat more." };
        };

        const buildWorkout = (state) => {
            let config = { title: "", text: "", expNote: "" };

            if (state.age === "over40") {
                config.title = "The Calibrated Load";
                config.text = "You need structural loading for bone density, but without the joint tax. Do your multi-joint free weights (squats/presses), but cap them at 3 sets of 8-10 reps. Auto-regulate: if it hurts the joint, use a dumbbell or machine variation.";
            } else if (state.goal === "power") {
                config.title = "The 5x5 Heavy";
                config.text = "Pick 3 big compound movements per workout. Do 5 sets of 5 reps. Rest 3-5 minutes between sets. Add weight to the bar every single time you train.";
            } else {
                config.title = "The 3x10 Pump";
                config.text = "Pick 4-5 exercises. Hit 3 sets of 10 reps focusing entirely on squeezing the muscle and chasing the pump. Keep rest periods to 60-90 seconds.";
            }

            config.expNote = state.experience === "beginner" 
                ? "Rule #1: Master the form with light weight before you push. Don't ego lift." 
                : "Since you know your way around, push your final working sets to 1-2 reps shy of absolute failure.";
                
            return config;
        };

        const buildCardio = (state) => {
            if (state.goal === "power") {
                return { title: "The Aerobic Base", text: "Do 30 minutes of Zone 2 (easy breathing) cardio on your off days. You need an aerobic base to clear metabolic waste and recover your CNS between heavy 5x5 sets." };
            }
            if (state.goal === "shred" && state.age === "under40") {
                return { title: "The HIIT Burner", text: "Do 15 minutes of hard intervals (sprints, rowing, or bike) at the very end of your workout. Empty the tank." };
            }
            return { title: "The LISS Walk", text: "Go for a 30-minute brisk walk or incline treadmill session on your rest days. Keeps the heart healthy without draining your recovery." };
        };

        const buildRecovery = (state) => {
            if (state.age === "over40") {
                return { title: "The WD-40", text: "10 minutes of dynamic hip and shoulder openers before you ever touch a weight. Sleep 8 hours minimum—your tissue takes longer to repair now." };
            }
            if (state.goal === "power") {
                return { title: "The CNS Coma", text: "Heavy lifting fries your nervous system. Prioritize a strict 8-hour sleep window and consider 400mg of Magnesium Glycinate before bed to down-regulate your system." };
            }
            return { title: "The Primer", text: "Do 5 minutes of core activation (planks/bird-dogs) before lifting to ensure you don't blow out your lower back. Prioritize 7-8 hours of sleep." };
        };

        const buildAnchor = (state) => {
            if (state.goal === "shred") {
                return { title: "10k Before Dinner", text: "Hit 10,000 steps before you sit down for your evening meal. Non-negotiable." };
            }
            return { title: "The Gallon", text: "Drink one full gallon of water every single day. Dehydrated muscle tissue does not grow and joint lubrication plummets. Non-negotiable." };
        };

        // --- MAIN EXECUTION ---
        function generatePlan() {
            // 1. Capture State
            const state = {
                goal: document.querySelector('input[name="goal"]:checked').value,
                experience: document.querySelector('input[name="experience"]:checked').value,
                age: document.querySelector('input[name="age"]:checked').value
            };

            // 2. Generate Modules
            const diet = buildDiet(state);
            const workout = buildWorkout(state);
            const cardio = buildCardio(state);
            const recovery = buildRecovery(state);
            const anchor = buildAnchor(state);

            // 3. Inject DOM
            document.getElementById('dietTitle').innerText = diet.title;
            document.getElementById('dietText').innerText = diet.text;

            document.getElementById('workoutTitle').innerText = workout.title;
            document.getElementById('workoutText').innerText = workout.text;
            document.getElementById('expNote').innerText = workout.expNote;

            document.getElementById('cardioTitle').innerText = cardio.title;
            document.getElementById('cardioText').innerText = cardio.text;

            document.getElementById('recoveryTitle').innerText = recovery.title;
            document.getElementById('recoveryText').innerText = recovery.text;

            document.getElementById('anchorTitle').innerText = anchor.title;
            document.getElementById('anchorText').innerText = anchor.text;

            // 4. Reveal
            const resultDiv = document.getElementById('resultContainer');
            resultDiv.classList.remove('hidden');
            resultDiv.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
