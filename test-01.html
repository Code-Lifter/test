<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INOL Strategy Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-10">

    <div class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- LEFT: INPUT & GENERATOR -->
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-xl">
            <h2 class="text-xl font-bold mb-6 text-blue-400">1. Set Your Baseline</h2>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">Your 1-Rep Max (kg/lbs)</label>
                    <input type="number" id="oneRm" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-2xl font-black focus:ring-2 focus:ring-blue-500 outline-none" placeholder="100">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <button onclick="generateWorkout('strength')" class="group p-4 bg-slate-800 hover:bg-blue-600 rounded-2xl transition text-left">
                        <div class="text-xs text-slate-400 group-hover:text-blue-100 uppercase font-bold">Goal</div>
                        <div class="text-lg font-bold">Strength</div>
                    </button>
                    <button onclick="generateWorkout('volume')" class="group p-4 bg-slate-800 hover:bg-emerald-600 rounded-2xl transition text-left">
                        <div class="text-xs text-slate-400 group-hover:text-emerald-100 uppercase font-bold">Goal</div>
                        <div class="text-lg font-bold">Volume</div>
                    </button>
                </div>
            </div>

            <div class="mt-10 pt-8 border-t border-slate-800">
                <h3 class="text-sm font-bold text-slate-500 uppercase mb-4 tracking-widest">Active Session Tracker</h3>
                <div id="sets-container" class="space-y-3">
                    <!-- Dynamic Rows -->
                </div>
                <button onclick="addSetRow()" class="mt-4 text-xs font-bold text-blue-400 hover:text-blue-300">+ Manually Add Set</button>
            </div>
        </div>

        <!-- RIGHT: RESULTS & ANALYSIS -->
        <div class="flex flex-col gap-6">
            <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-xl flex-1">
                <div class="flex justify-between items-start mb-6">
                    <h2 class="text-xl font-bold text-slate-300">Fatigue Analysis</h2>
                    <button onclick="calculateFinal()" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-full text-xs font-bold transition">Run Math</button>
                </div>

                <div class="flex items-center gap-6 mb-8">
                    <div id="totalVal" class="text-8xl font-black tracking-tighter">0.00</div>
                    <div>
                        <div id="status-pill" class="inline-block px-3 py-1 rounded-full text-[10px] font-black uppercase bg-slate-800 text-slate-500 mb-2">Standby</div>
                        <p id="status-desc" class="text-sm text-slate-400 leading-relaxed max-w-[200px]">Waiting for session data...</p>
                    </div>
                </div>

                <div id="suggestion-box" class="hidden bg-blue-900/20 border border-blue-800/50 p-4 rounded-2xl">
                    <h4 class="text-blue-400 text-xs font-bold uppercase mb-2">Suggested Approach</h4>
                    <p id="suggestion-text" class="text-sm text-blue-100"></p>
                </div>
            </div>

            <div class="bg-orange-600/10 border border-orange-600/20 p-6 rounded-3xl">
                <p class="text-orange-400 text-xs italic">"Stress Test: If the suggested weight feels like an RPE 10 on the first set, your 1RM is outdated. Stop immediately."</p>
            </div>
        </div>
    </div>

    <script>
        function addSetRow(weight = '', reps = '') {
            const container = document.getElementById('sets-container');
            const div = document.createElement('div');
            div.className = "set-row flex gap-2 items-center animate-in slide-in-from-left duration-200";
            div.innerHTML = `
                <input type="number" class="w-20 bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm set-weight" value="${weight}" placeholder="Wt">
                <input type="number" class="w-16 bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm set-reps" value="${reps}" placeholder="Reps">
                <select class="flex-1 bg-slate-950 border border-slate-700 rounded-lg p-2 text-[10px] font-bold set-rpe">
                    <option value="1.0">RPE 8 (Fast)</option>
                    <option value="1.1">RPE 9 (Slow)</option>
                    <option value="1.25">RPE 10 (Failure)</option>
                </select>
                <button onclick="this.closest('.set-row').remove()" class="text-slate-600 hover:text-red-500 px-2">✕</button>
            `;
            container.appendChild(div);
        }

        function generateWorkout(goal) {
            const oneRm = parseFloat(document.getElementById('oneRm').value);
            if (!oneRm) { alert("Enter 1RM first."); return; }
            
            document.getElementById('sets-container').innerHTML = '';
            const sugBox = document.getElementById('suggestion-box');
            const sugText = document.getElementById('suggestion-text');
            sugBox.classList.remove('hidden');

            if (goal === 'strength') {
                const weight = Math.round(oneRm * 0.85);
                sugText.innerText = `For Strength: Aim for 3-4 sets of 3-4 reps at ${weight}kg. This hits an INOL of ~0.8.`;
                for(let i=0; i<3; i++) addSetRow(weight, 4);
            } else {
                const weight = Math.round(oneRm * 0.75);
                sugText.innerText = `For Volume: Aim for 3 sets of 8-10 reps at ${weight}kg. This hits an INOL of ~0.9.`;
                for(let i=0; i<3; i++) addSetRow(weight, 8);
            }
            calculateFinal();
        }

        function calculateFinal() {
            const oneRm = parseFloat(document.getElementById('oneRm').value);
            let totalInol = 0;
            const rows = document.querySelectorAll('.set-row');

            rows.forEach(row => {
                const w = parseFloat(row.querySelector('.set-weight').value);
                const r = parseFloat(row.querySelector('.set-reps').value);
                const mRpe = parseFloat(row.querySelector('.set-rpe').value);
                if (w && r && oneRm) {
                    const intensity = (w / oneRm) * 100;
                    totalInol += (r / (100 - intensity)) * mRpe;
                }
            });

            const display = document.getElementById('totalVal');
            const pill = document.getElementById('status-pill');
            const desc = document.getElementById('status-desc');
            
            display.innerText = totalInol.toFixed(2);

            if (totalInol < 0.4) {
                pill.className = "inline-block px-3 py-1 rounded-full text-[10px] font-black uppercase bg-slate-800 text-slate-500 mb-2";
                pill.innerText = "Underloaded";
                desc.innerText = "Minimal stimulus. Good for active recovery only.";
            } else if (totalInol <= 1.0) {
                pill.className = "inline-block px-3 py-1 rounded-full text-[10px] font-black uppercase bg-emerald-500/20 text-emerald-400 mb-2";
                pill.innerText = "Optimal";
                desc.innerText = "The sweet spot for growth. Safe to repeat this weekly.";
            } else {
                pill.className = "inline-block px-3 py-1 rounded-full text-[10px] font-black uppercase bg-red-500/20 text-red-400 mb-2";
                pill.innerText = "High Stress";
                desc.innerText = "Recovery debt incurred. Do not hit this exercise for 4-5 days.";
            }
        }
    </script>
</body>
</html>
