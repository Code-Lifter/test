<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Bracket</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-10 font-sans">

    <div class="max-w-6xl mx-auto">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
            <h1 class="text-3xl font-black text-slate-800 mb-2 text-center italic tracking-tight">BRACKET MASTER</h1>
            <p class="text-center text-slate-500 mb-8">Click a player's name to advance them to the next round.</p>
            
            <!-- Setup -->
            <div id="setupArea" class="mb-10 flex flex-col items-center gap-4">
                <textarea id="playerInput" class="w-full max-w-md p-4 border-2 border-slate-200 rounded-xl focus:border-blue-500 outline-none transition-all" rows="4" placeholder="Enter names (one per line)"></textarea>
                <button onclick="buildBracket()" class="bg-slate-900 hover:bg-blue-600 text-white font-bold py-3 px-10 rounded-full transition-all transform hover:scale-105">
                    Start Tournament
                </button>
            </div>

            <!-- The Bracket -->
            <div id="bracketContainer" class="flex justify-start gap-8 overflow-x-auto pb-10">
                <!-- Rounds appear here -->
            </div>
        </div>
    </div>

    <script>
        function buildBracket() {
            const input = document.getElementById('playerInput').value.trim();
            const players = input.split('\n').filter(name => name.trim() !== "");
            const container = document.getElementById('bracketContainer');
            
            if (players.length < 2) return alert("Add at least 2 players!");

            container.innerHTML = '';
            // Hide setup once started to save space
            document.getElementById('setupArea').classList.add('hidden');

            let participantCount = players.length;
            let roundCount = Math.ceil(Math.log2(participantCount));
            let currentPlayers = [...players];

            for (let r = 0; r <= roundCount; r++) {
                const roundDiv = document.createElement('div');
                roundDiv.className = "flex flex-col justify-around gap-8 min-w-[180px]";
                roundDiv.id = `round-${r}`;

                // Create matches for this round
                let matchesInRound = Math.ceil(participantCount / Math.pow(2, r + 1));
                if (r === roundCount) matchesInRound = 1; // The Champion slot

                for (let m = 0; m < (r === roundCount ? 1 : Math.pow(2, roundCount - r - 1)); m++) {
                    const matchDiv = document.createElement('div');
                    matchDiv.className = "flex flex-col gap-1";

                    // Create two slots per match (unless it's the final winner slot)
                    const slotCount = (r === roundCount) ? 1 : 2;
                    
                    for (let s = 0; s < slotCount; s++) {
                        const slot = document.createElement('div');
                        // Unique ID so we can find this slot later to "fill" it
                        slot.id = `r${r}-m${m}-s${s}`; 
                        slot.className = "h-10 px-3 flex items-center bg-slate-50 border-2 border-slate-200 rounded-lg text-sm font-bold text-slate-700 cursor-pointer hover:bg-blue-50 hover:border-blue-300 transition-all truncate";
                        
                        // Fill initial players in Round 0
                        if (r === 0 && currentPlayers.length > 0) {
                            slot.innerText = currentPlayers.shift() || "";
                        } else {
                            slot.innerText = "—";
                        }

                        // Add click event to advance
                        slot.onclick = () => advancePlayer(r, m, slot.innerText);
                        
                        matchDiv.appendChild(slot);
                    }
                    roundDiv.appendChild(matchDiv);
                }
                container.appendChild(roundDiv);
            }
        }

        function advancePlayer(currentRound, currentMatch, playerName) {
            if (playerName === "—" || !playerName) return;

            // Determine the next location
            const nextRound = currentRound + 1;
            const nextMatch = Math.floor(currentMatch / 2);
            const nextSlot = currentMatch % 2;

            const targetSlot = document.getElementById(`r${nextRound}-m${nextMatch}-s${nextSlot}`);
            
            if (targetSlot) {
                targetSlot.innerText = playerName;
                // Add a little pop animation
                targetSlot.classList.add('bg-green-100', 'border-green-500');
                setTimeout(() => {
                    targetSlot.classList.remove('bg-green-100', 'border-green-500');
                }, 500);
            } else {
                alert("🏆 WE HAVE A WINNER: " + playerName);
            }
        }
    </script>
</body>
</html>
