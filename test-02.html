<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1RM Calculator Template</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Syne:wght@400;600;700;800&family=Teko:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #060a10;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: 'Syne', system-ui, sans-serif; 
            background: var(--bg); 
            color: #e2e8f0; 
            min-height: 100vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .mono { font-family: 'DM Mono', 'Courier New', monospace; }
        .brand-font { font-family: 'Teko', sans-serif; }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 0;
        }
        .content { position: relative; z-index: 1; width: 100%; max-w-md; }
    </style>
</head>
<body class="selection:bg-amber-500 selection:text-slate-900">

<div class="content max-w-md w-full">
    
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-white text-2xl uppercase tracking-wide brand-font flex items-center gap-2">
                <span class="text-amber-500">🛡️</span> 1 Rep Max
            </h2>
        </div>

        <div class="space-y-4">
            <!-- PRIMARY INPUTS -->
            <div class="grid grid-cols-2 gap-4">
                <div class="relative">
                    <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1">Weight Lifted</label>
                    <input type="number" id="calc-weight" oninput="calculate1RM()" placeholder="100" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-2xl font-black mono focus:border-amber-500 outline-none text-white text-center transition-colors">
                </div>
                <div class="relative">
                    <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1">Reps Completed</label>
                    <input type="number" id="calc-reps" oninput="calculate1RM()" placeholder="5" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-2xl font-black mono focus:border-amber-500 outline-none text-white text-center transition-colors">
                </div>
            </div>

            <!-- RIR INPUT -->
            <div class="relative">
                <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1">RIR (Reps In Reserve)</label>
                <input type="number" id="calc-rir" oninput="calculate1RM()" placeholder="0" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xl font-bold mono focus:border-amber-500 outline-none text-white text-center transition-colors">
            </div>

            <!-- SETTINGS INPUTS -->
            <div class="grid grid-cols-2 gap-4 pt-2 border-t border-slate-800/50">
                <div class="relative">
                    <label class="block text-slate-500 text-[9px] font-bold uppercase tracking-widest mb-1">Start Weight (e.g., Bar)</label>
                    <input type="number" id="calc-start" oninput="calculate1RM()" placeholder="20" value="0" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-sm font-bold mono focus:border-amber-500 outline-none text-slate-300 text-center transition-colors">
                </div>
                <div class="relative">
                    <label class="block text-slate-500 text-[9px] font-bold uppercase tracking-widest mb-1">Weight Interval</label>
                    <input type="number" id="calc-interval" oninput="calculate1RM()" placeholder="2.5" value="1.25" step="0.25" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-sm font-bold mono focus:border-amber-500 outline-none text-slate-300 text-center transition-colors">
                </div>
            </div>

            <!-- RESULT DISPLAY -->
            <div class="flex flex-col items-center justify-center bg-amber-900/10 border border-amber-900/30 rounded-xl p-6 mt-4 shadow-inner">
                <span class="text-[10px] text-amber-500 font-bold uppercase tracking-widest mb-1">Estimated 1RM</span>
                <span id="calc-result" class="text-5xl font-black mono text-amber-400 drop-shadow-md">—</span>
            </div>
            
        </div>
    </div>
</div>

<script>
    function calculate1RM() {
        // 1. Get raw values
        const weightInput = document.getElementById('calc-weight').value;
        const repsInput = document.getElementById('calc-reps').value;
        const rirInput = document.getElementById('calc-rir').value;
        const startInput = document.getElementById('calc-start').value;
        const intervalInput = document.getElementById('calc-interval').value;

        // 2. Parse numbers (handling empty fields safely)
        const weight = parseFloat(weightInput);
        const reps = parseFloat(repsInput);
        const rir = rirInput === '' ? 0 : parseFloat(rirInput);
        const startWeight = startInput === '' ? 0 : parseFloat(startInput);
        const interval = intervalInput === '' ? 1 : parseFloat(intervalInput);

        const resultEl = document.getElementById('calc-result');

        // 3. Validation
        if (isNaN(weight) || isNaN(reps) || weight <= 0 || reps <= 0) {
            resultEl.innerText = '—';
            return;
        }

        // 4. Calculate Raw 1RM (Epley Formula modified for RIR)
        const effectiveReps = reps + rir;
        const raw1RM = weight * (1 + (effectiveReps / 30));

        // 5. Apply Rounding Math
        let final1RM = raw1RM;
        
        if (interval > 0) {
            // Find the weight to be added to the "start weight"
            const addedWeight = Math.max(0, raw1RM - startWeight);
            
            // Round the added weight to the nearest interval
            const roundedAddedWeight = Math.round(addedWeight / interval) * interval;
            
            // Re-add the start weight to get the final rounded 1RM
            final1RM = roundedAddedWeight + startWeight;
        }

        // 6. Display Result (clean up trailing .00 decimals if they exist)
        resultEl.innerText = final1RM.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
    }

    // Initialize calculation on load just in case values are pre-filled
    calculate1RM();
</script>
</body>
</html>
