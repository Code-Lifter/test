<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Ping Pong Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col font-sans selection:bg-emerald-500/30">

  <a href="#" class="block w-full text-center py-4 text-slate-400 hover:text-emerald-400 font-semibold transition-colors border-b border-slate-800">
    &larr; Back to Home
  </a>

  <div class="flex-1 flex items-center justify-center p-4">
    <div class="bg-slate-800 p-6 sm:p-8 rounded-2xl shadow-2xl max-w-md w-full text-center border border-slate-700">
      
      <div class="flex justify-between items-center mb-6 bg-slate-900 p-3 rounded-lg border border-slate-700">
        <span class="text-sm font-semibold text-slate-300">Play to 21</span>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="ruleToggle" class="sr-only peer" onchange="toggleRules()">
          <div class="w-11 h-6 bg-slate-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
        </label>
      </div>

      <div class="flex justify-between items-center mb-6 gap-4 sm:gap-6">
        <div class="flex-1 bg-slate-700/50 p-4 rounded-xl border border-slate-600">
          <h2 class="text-base sm:text-lg font-semibold mb-2 text-slate-300">Player 1 
            <div id="serve1" class="text-yellow-400 text-xs font-bold uppercase mt-1 tracking-wider h-4">🏓 Serve</div>
          </h2>
          <div id="score1" class="text-6xl sm:text-7xl font-black mb-4 tabular-nums">0</div>
          <button onclick="addPoint(1)" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-900 py-3 sm:py-4 rounded-lg font-bold text-lg transition-all active:scale-95 disabled:opacity-50 disabled:active:scale-100" id="btn1">+1</button>
        </div>

        <div class="text-2xl sm:text-3xl font-black text-slate-600 pb-12">VS</div>

        <div class="flex-1 bg-slate-700/50 p-4 rounded-xl border border-slate-600">
          <h2 class="text-base sm:text-lg font-semibold mb-2 text-slate-300">Player 2 
            <div id="serve2" class="text-yellow-400 text-xs font-bold uppercase mt-1 tracking-wider invisible h-4">🏓 Serve</div>
          </h2>
          <div id="score2" class="text-6xl sm:text-7xl font-black mb-4 tabular-nums">0</div>
          <button onclick="addPoint(2)" class="w-full bg-blue-500 hover:bg-blue-400 text-slate-900 py-3 sm:py-4 rounded-lg font-bold text-lg transition-all active:scale-95 disabled:opacity-50 disabled:active:scale-100" id="btn2">+1</button>
        </div>
      </div>

      <div id="status" class="text-lg sm:text-xl font-bold text-slate-400 mb-6 h-8 flex items-center justify-center bg-slate-900 rounded-lg">First to 11 (Win by 2)</div>

      <div class="grid grid-cols-2 gap-4 mb-4">
        <button onclick="undo()" id="undoBtn" class="bg-slate-700 hover:bg-slate-600 text-slate-300 py-2 rounded-lg font-semibold transition-colors disabled:opacity-30 disabled:hover:bg-slate-700 flex justify-center items-center gap-2">
          &#8617; Undo
        </button>
        <button onclick="redo()" id="redoBtn" class="bg-slate-700 hover:bg-slate-600 text-slate-300 py-2 rounded-lg font-semibold transition-colors disabled:opacity-30 disabled:hover:bg-slate-700 flex justify-center items-center gap-2">
          Redo &#8618;
        </button>
      </div>

      <button onclick="resetGame()" class="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/50 py-3 rounded-lg font-bold transition-colors mt-2">Reset Match</button>
    </div>
  </div>

  <script>
    // State Architecture
    let matchHistory = [{ p1: 0, p2: 0 }];
    let currentStep = 0;
    let playTo21 = false;
    let isGameOver = false;

    // Local Storage Keys
    const STORAGE_KEY = 'pingPongTrackerState';

    // Initialize
    window.onload = () => {
      const savedData = localStorage.getItem(STORAGE_KEY);
      if (savedData) {
        const parsed = JSON.parse(savedData);
        matchHistory = parsed.history;
        currentStep = parsed.step;
        playTo21 = parsed.playTo21;
        document.getElementById('ruleToggle').checked = playTo21;
      }
      updateUI();
    };

    const saveData = () => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        history: matchHistory,
        step: currentStep,
        playTo21: playTo21
      }));
    };

    const toggleRules = () => {
      playTo21 = document.getElementById('ruleToggle').checked;
      resetGame(); 
    };

    const addPoint = (player) => {
      if (isGameOver) return;
      
      // Slice history to remove redo futures if a new point is scored after undoing
      matchHistory = matchHistory.slice(0, currentStep + 1);
      
      const currentState = matchHistory[currentStep];
      const newState = { 
        p1: currentState.p1 + (player === 1 ? 1 : 0), 
        p2: currentState.p2 + (player === 2 ? 1 : 0) 
      };
      
      matchHistory.push(newState);
      currentStep++;
      updateUI();
    };

    const undo = () => {
      if (currentStep > 0) {
        currentStep--;
        updateUI();
      }
    };

    const redo = () => {
      if (currentStep < matchHistory.length - 1) {
        currentStep++;
        updateUI();
      }
    };

    const resetGame = () => {
      if(confirm('Are you sure you want to reset the match?')) {
        matchHistory = [{ p1: 0, p2: 0 }];
        currentStep = 0;
        updateUI();
      }
    };

    const updateUI = () => {
      const state = matchHistory[currentStep];
      document.getElementById('score1').textContent = state.p1;
      document.getElementById('score2').textContent = state.p2;

      const winningScore = playTo21 ? 21 : 11;
      const serveSwitchFrequency = playTo21 ? 5 : 2;
      const deuceThreshold = winningScore - 1;

      // Serve Logic
      const totalPoints = state.p1 + state.p2;
      let p1Serves = true;

      if (state.p1 >= deuceThreshold && state.p2 >= deuceThreshold) {
        p1Serves = (totalPoints % 2 === 0);
        document.getElementById('status').textContent = 'Deuce! Alternate serves.';
      } else {
        p1Serves = Math.floor(totalPoints / serveSwitchFrequency) % 2 === 0;
        document.getElementById('status').textContent = `First to ${winningScore} (Win by 2)`;
      }

      // Check Win Condition
      isGameOver = ((state.p1 >= winningScore || state.p2 >= winningScore) && Math.abs(state.p1 - state.p2) >= 2);

      const serve1El = document.getElementById('serve1');
      const serve2El = document.getElementById('serve2');
      const btn1 = document.getElementById('btn1');
      const btn2 = document.getElementById('btn2');
      const statusEl = document.getElementById('status');

      if (isGameOver) {
        const winner = state.p1 > state.p2 ? 'Player 1' : 'Player 2';
        statusEl.textContent = `🏆 ${winner} Wins!`;
        statusEl.classList.replace('text-slate-400', 'text-yellow-400');
        serve1El.classList.add('invisible');
        serve2El.classList.add('invisible');
        btn1.disabled = true;
        btn2.disabled = true;
      } else {
        statusEl.classList.replace('text-yellow-400', 'text-slate-400');
        serve1El.classList.toggle('invisible', !p1Serves);
        serve2El.classList.toggle('invisible', p1Serves);
        btn1.disabled = false;
        btn2.disabled = false;
      }

      // Time Machine Buttons
      document.getElementById('undoBtn').disabled = currentStep === 0;
      document.getElementById('redoBtn').disabled = currentStep === matchHistory.length - 1;

      saveData();
    };
  </script>
</body>
</html>
